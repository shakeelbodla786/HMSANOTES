<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جماعت 8 - اردو گرامر ٹیسٹ 2 - HMSA Learning Academy</title>

<!-- اردو نستعلیق فونٹ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    body { 
        font-family: 'Noto Nastaliq Urdu', Arial, sans-serif; 
        background-color: #f2f6f7; 
        margin: 0; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: flex-start; 
        min-height: 100vh; 
        direction: rtl; 
    }
    .quiz-container { 
        background: white; 
        padding: 25px; 
        border-radius: 13px; 
        box-shadow: 0 3px 12px #123b6510; 
        width: 100%; 
        max-width: 650px; 
        border-top: 5px solid #123b65;
    }
    .header { 
        color: #087c59; 
        font-size: 24px; 
        margin-bottom: 10px; 
        font-weight: bold; 
        text-align: center;
    }
    .sub-header {
        text-align: center;
        color: #526575;
        margin-bottom: 15px;
        font-size: 16px;
    }
    .timer-box {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #dc3545;
        background: #f8d7da;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
    }
    #question-text { 
        font-size: 22px; 
        margin-bottom: 20px; 
        font-weight: bold; 
        color: #263746; 
        line-height: 1.6;
    }
    .options-container { 
        display: flex; 
        flex-direction: column; 
        gap: 12px; 
    }
    .option-btn { 
        background: #e9ecef; 
        border: 2px solid #ced4da; 
        padding: 12px; 
        border-radius: 8px; 
        font-size: 18px; 
        cursor: pointer; 
        transition: 0.3s; 
        font-family: inherit; 
        text-align: right;
    }
    .option-btn:hover { 
        background: #d1d8e0; 
    }
    .option-btn.correct { 
        background: #28a745 !important; 
        color: white; 
        border-color: #28a745; 
    }
    .option-btn.wrong { 
        background: #dc3545 !important; 
        color: white; 
        border-color: #dc3545; 
    }
    #next-btn { 
        display: none; 
        margin-top: 25px; 
        padding: 12px; 
        background: #123b65; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-size: 20px; 
        font-weight: bold; 
        cursor: pointer; 
        font-family: inherit; 
        width: 100%;
    }
    #next-btn:hover {
        background: #0d2a4b;
    }
    #score-display { 
        margin-top: 20px; 
        font-size: 18px; 
        color: #123b65; 
        font-weight: bold; 
        text-align: center;
    }
    .hidden { display: none; }
    .result-box { text-align: center; }
    .result-box h2 { color: #087c59; }
    .back-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background: #123b65;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-family: inherit;
    }
</style>
</head>
<body>

<div class="quiz-container">
    <div class="header" id="test-title">جماعت 8 - اردو گرامر ٹیسٹ 2</div>
    <div class="sub-header">HMSA Learning Academy</div>
    
    <div class="timer-box" id="timer-display">باقی وقت: 05:00</div>

    <div id="quiz-box">
        <div id="question-text">لوڈنگ...</div>
        <div class="options-container" id="options-box"></div>
        <button id="next-btn" onclick="loadNextQuestion()">اگلا سوال</button>
        <div id="score-display">سکور: 0 / 0</div>
    </div>

    <div id="result-box" class="hidden result-box">
        <h2 id="result-title">ٹیسٹ مکمل! 🎉</h2>
        <p id="final-score" style="font-size: 22px; color: #263746; font-weight: bold;"></p>
        <a href="index.html" class="back-btn">واپس ہوم پیج پر جائیں</a>
    </div>
</div>

<script>
    // ==========================================
    // جماعت 8 اردو گرامر کے 20 نئے سوالات (ٹیسٹ 2)
    // ==========================================
    const questions = [
        {
            question: "''مضمون'' کی جمع کیا ہے؟",
            options: ["مضمونات", "مضامین", "مضمونے", "مضمونیں"],
            answer: 1 
        },
        {
            question: "''استاد'' کی جمع کیا ہے؟",
            options: ["استادوں", "استادیں", "اساتذہ", "استادے"],
            answer: 2
        },
        {
            question: "''پہاڑ'' کی جمع کیا ہے؟",
            options: ["پہاڑے", "پہاڑیں", "پہاڑات", "پہاڑوں"],
            answer: 3
        },
        {
            question: "''باغ'' کی جمع کیا ہے؟",
            options: ["باغات", "باغیں", "باغے", "باغوں"],
            answer: 0
        },
        {
            question: "''نادان'' کا متضاد لفظ کیا ہے؟",
            options: ["دانشمند", "بیوقوف", "جاہل", "ان پڑھ"],
            answer: 0
        },
        {
            question: "''آزادی'' کا متضاد لفظ کیا ہے؟",
            options: ["غلامی", "قید", "جیل", "پابندی"],
            answer: 0
        },
        {
            question: "''دوست'' کا متضاد لفظ کیا ہے؟",
            options: ["رفیق", "دشمن", "ساتھی", "ہم سفر"],
            answer: 1
        },
        {
            question: "''شجاع'' کا مترادف لفظ کیا ہے؟",
            options: ["بزدل", "ڈرپوک", "بہادر", "کمزور"],
            answer: 2
        },
        {
            question: "''سخاوت'' کا مترادف لفظ کیا ہے؟",
            options: ["کنجوسی", "فیاضی", "امیری", "غربت"],
            answer: 1
        },
        {
            question: "''مسکراہٹ'' کا مترادف لفظ کیا ہے؟",
            options: ["رونا", "تبسم", "غصہ", "چیخ"],
            answer: 1
        },
        {
            question: "وہ اسم جو کسی عام شخص یا چیز کے لیے استعمال ہو، کیا کہلاتا ہے؟",
            options: ["اسم معرفہ", "اسم نکرہ", "اسم ضمیر", "اسم اشارہ"],
            answer: 1
        },
        {
            question: "''وہ لڑکا بہت محنتی ہے''۔ اس جملے میں ''وہ'' کیا ہے؟",
            options: ["اسم اشارہ", "اسم موصول", "اسم ضمیر", "اسم نکرہ"],
            answer: 0
        },
        {
            question: "''میں روزانہ سکول جاتا ہوں''۔ اس جملے میں ''روزانہ'' کیا ہے؟",
            options: ["اسم", "فعل", "ظرفِ زمان", "ظرفِ مکان"],
            answer: 2
        },
        {
            question: "''احمد نے خط لکھا''۔ اس جملے میں مفعول (Object) کون ہے؟",
            options: ["احمد", "نے", "خط", "لکھا"],
            answer: 2
        },
        {
            question: "''آنسو بہانا'' محاورے کا مطلب کیا ہے؟",
            options: ["رونا", "ہنسنا", "خوش ہونا", "ڈرنا"],
            answer: 0
        },
        {
            question: "''آنکھیں بچھانا'' محاورے کا مطلب کیا ہے؟",
            options: ["سونا", "عزت کرنا", "دھوکہ دینا", "لڑنا"],
            answer: 1
        },
        {
            question: "''نیک نام'' کا مطلب کیا ہے؟",
            options: ["برا نام", "اچھا نام", "جھوٹا نام", "پرانام"],
            answer: 1
        },
        {
            question: "''دشت نوردی'' کا مطلب کیا ہے؟",
            options: ["شہر میں گھومنا", "جنگل میں جانا", "صحرا میں سفر کرنا", "پہاڑ پر چڑھنا"],
            answer: 2
        },
        {
            question: "''چراغِ راہ'' کا مطلب کیا ہے؟",
            options: ["اندھیرا", "راستہ دکھانے والا", "گلی", "روشنی"],
            answer: 1
        },
        {
            question: "''دجلہ'' اور ''فرات'' کس ملک کے دریا ہیں؟",
            options: ["مصر", "عراق", "شام", "ایران"],
            answer: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    
    // 5 منٹ کا ٹائمر
    let timeLeft = 300; 
    let timerInterval;

    const questionText = document.getElementById('question-text');
    const optionsBox = document.getElementById('options-box');
    const nextBtn = document.getElementById('next-btn');
    const scoreDisplay = document.getElementById('score-display');
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const timerDisplay = document.getElementById('timer-display');

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endTestDueToTime();
            } else {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                timerDisplay.innerText = `باقی وقت: ${minutes}:${seconds}`;
            }
        }, 1000); 
    }

    function endTestDueToTime() {
        timerDisplay.innerText = "وقت ختم!";
        timerDisplay.style.color = "red";
        showResult(true);
    }

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = 'none';
        const currentQuestion = questions[currentQuestionIndex];
        
        questionText.innerText = (currentQuestionIndex + 1) + ". " + currentQuestion.question;
        
        optionsBox.innerHTML = '';

        currentQuestion.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.innerText = option;
            btn.classList.add('option-btn');
            btn.onclick = () => checkAnswer(index, btn);
            optionsBox.appendChild(btn);
        });
        
        updateScore();
    }

    function checkAnswer(selectedIndex, btn) {
        if (answered) return;
        answered = true;
        const currentQuestion = questions[currentQuestionIndex];
        const allBtns = optionsBox.querySelectorAll('.option-btn');

        if (selectedIndex === currentQuestion.answer) {
            btn.classList.add('correct'); 
            score++;
        } else {
            btn.classList.add('wrong'); 
            allBtns[currentQuestion.answer].classList.add('correct'); 
        }

        allBtns.forEach(b => b.disabled = true);
        updateScore();
        nextBtn.style.display = 'block';
    }

    function loadNextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            showResult(false);
        }
    }

    function updateScore() {
        scoreDisplay.innerText = `سکور: ${score} / ${currentQuestionIndex + 1}`;
    }

    function showResult(isTimeUp) {
        quizBox.classList.add('hidden');
        resultBox.classList.remove('hidden');
        
        if(isTimeUp) {
            document.getElementById('result-title').innerText = "وقت ختم ہو گیا! ⏰";
        } else {
            document.getElementById('result-title').innerText = "ٹیسٹ مکمل! 🎉";
        }
        
        document.getElementById('final-score').innerText = `آپ نے کل ${questions.length} سوالات میں سے ${score} نمبر حاصل کیے۔`;
    }

    if(questions.length > 0) {
        startTimer(); 
        loadQuestion(); 
    } else {
        questionText.innerText = "معذرت، ابھی کوئی سوالات شامل نہیں کیے گئے۔";
    }
</script>

</body>
</html>
