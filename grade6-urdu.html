<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جماعت ششم - اردو گرامر آن لائن ٹیسٹ | HMSA Learning Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102b4c;--green:#087c59;--gold:#e8c66b;--light:#f2f6f7;--red:#d90429}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Tahoma, Arial, sans-serif;background:var(--light);color:#263746;padding:15px;line-height:2.2}
.container{max-width:780px;margin:auto;background:white;padding:25px 30px;border-radius:13px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-top:5px solid var(--green)}
h2{text-align:center;color:var(--navy);margin:0 0 5px 0;font-size:24px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:20px;font-family:Arial, sans-serif}
.quiz-header{display:flex;justify-content:space-between;align-items:center;background:#e5f3ec;padding:8px 18px;border-radius:8px;margin-bottom:18px;font-weight:bold;color:var(--navy);font-size:16px}
.question{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:18px;background:#f8fcfa;padding:15px 18px;border-radius:8px;border-right:4px solid var(--green);text-align:right;}
.options{display:grid;gap:12px;margin-bottom:15px}
.opt-btn{background:#fff;border:2px solid #d7e5df;padding:10px 18px;text-align:right;font-size:17px;font-family:'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', Tahoma, sans-serif;border-radius:8px;cursor:pointer;transition:0.2s;color:#263746;line-height:2}
.opt-btn:hover:not(:disabled){background:#e5f3ec;border-color:var(--green)}
#feedback-box{text-align:center;margin:12px 0;font-size:18px;font-weight:bold;min-height:38px;}
.score-box{text-align:center;display:none;padding:15px 0}
.score-box h3{color:var(--navy);font-size:26px;margin-bottom:10px}
.result-card{background:#f8fcfa;border:2px solid #d7e5df;border-radius:10px;padding:20px;margin:15px auto;max-width:450px}
.result-item{font-size:19px;margin:8px 0;color:var(--navy);font-weight:bold}
.restart-btn{background:var(--navy);color:white;border:none;padding:10px 28px;font-size:17px;font-family:'Noto Nastaliq Urdu', Tahoma, sans-serif;border-radius:8px;cursor:pointer;margin-top:15px}
.back-link{display:block;text-align:center;margin-top:22px;color:var(--green);text-decoration:none;font-weight:bold;font-size:16px}
</style>
</head>
<body>

<div class="container">
    <h2>جماعت ششم — اردو قواعد و انشاء آن لائن ٹیسٹ</h2>
    <p class="subtitle">Grade 6 Urdu Grammar Online Quiz — HMSA Learning Academy</p>

    <div id="quiz-screen" class="quiz-box">
        <div class="quiz-header">
            <span id="progress-text">سوال 1 از 20</span>
            <span>کل نمبر: 20</span>
        </div>
        <div id="question-text" class="question">سوال یہاں ظاہر ہوگا</div>
        <div id="options-box" class="options"></div>
        <div id="feedback-box"></div>
    </div>

    <div id="score-screen" class="score-box">
        <h3>ٹیسٹ مکمل ہو گیا!</h3>
        <div class="result-card">
            <div class="result-item" id="total-q">کل سوالات: 20</div>
            <div class="result-item" id="correct-q" style="color: #087c59;">درست جوابات: 0</div>
            <div class="result-item" id="obtained-marks">حاصل کردہ نمبر: 0 / 20</div>
            <div class="result-item" id="percentage-score" style="color: #102b4c; font-size: 22px;">فیصد (Percentage): 0%</div>
        </div>
        <button class="restart-btn" onclick="startTest()">دوبارہ ٹیسٹ شروع کریں</button>
    </div>

    <a class="back-link" href="index.html">← مرکزی ہوم پیج پر واپس جائیں</a>
</div>

<script>
const grade6UrduData = [
    { q: "1. ادبی اصطلاح میں ایسی نظم جس میں حضرت محمد ﷺ کی تعریف و توصیف بیان کی گئی ہو، کیا کہلاتی ہے؟", options: ["الف) حمد", "ب) نعت", "ج) قصیدہ", "د) مثنوی"], answer: 1 },
    { q: "2. 'رموز' کس لفظ کی جمع ہے؟", options: ["الف) رمز", "ب) رمزیہ", "ج) رموزات", "د) راز"], answer: 0 },
    { q: "3. ایسے جملے جن میں کسی سے کچھ پوچھا جائے، ان کے آخر میں کون سی علامت لگائی جاتی ہے؟", options: ["الف) ختمہ (۔)", "ب) سوالیہ (؟)", "ج) ندائیہ (!)", "د) سکتہ (،)"], answer: 1 },
    { q: "4. عبارت میں کوئی تفصیل بیان کرنے یا تشریح کرنے کے لیے کون سی علامت استعمال ہوتی ہے؟", options: ["الف) واوین (” “)", "ب) تفصیلیہ (:-)", "ج) قوسین ( )", "د) رابطہ (:)"], answer: 1 },
    { q: "5. کسی کا قول یا اقتباس جوں کا توں پیش کرنے کے لیے کون سی علامت لگائی جاتی ہے؟", options: ["الف) واوین (” “)", "ب) تفصیلیہ (:-)", "ج) سوالیہ (؟)", "د) ختمہ (۔)"], answer: 0 },
    { q: "6. ایسے الفاظ جو معنی کے لحاظ سے ایک دوسرے کے الٹ ہوں، کیا کہلاتے ہیں؟", options: ["الف) مترادف الفاظ", "ب) متضاد الفاظ", "ج) مرکب الفاظ", "د) ہم آواز الفاظ"], answer: 1 },
    { q: "7. مضمون لکھنے کے بنیادی طور پر کتنے حصے ہوتے ہیں؟", options: ["الف) دو", "ب) تین", "ج) چار", "د) پانچ"], answer: 1 },
    { q: "8. قواعد کی رو سے لفظ 'دہی' کی جنس کیا ہے؟", options: ["الف) مونث", "ب) مذکر", "ج) دونوں درست ہیں", "د) غیر حقیقی مونث"], answer: 1 },
    { q: "9. لفظ 'منظر' کی درست جمع کیا ہوگی؟", options: ["الف) منظروں", "ب) مناظر", "ج) مناظرات", "د) منظرین"], answer: 1 },
    { q: "10. وہ اسم جو کسی خاص شخص، جگہ یا چیز کا نام ہو، کیا کہلاتا ہے؟", options: ["الف) اسمِ نکرہ", "ب) اسمِ معرفہ", "ج) اسمِ صفت", "د) اسمِ ضمیر"], answer: 1 },
    { q: "11. ایسا مرکب جس میں دو اسموں یا فعلوں کو آپس میں ملانے کے لیے 'و' یا 'اور' استعمال ہو، کیا کہلاتا ہے؟", options: ["الف) مرکبِ اضافی", "ب) مرکبِ توصیفی", "ج) مرکبِ عطفی", "د) مرکبِ جاری"], answer: 2 },
    { q: "12. جملہ 'کھانا کھاؤ اور سو جاؤ' ساخت کے لحاظ سے کون سا جملہ ہے؟", options: ["الف) مفرد جملہ", "ب) مرکب جملہ", "ج) سوالیہ جملہ", "د) فجائیہ جملہ"], answer: 1 },
    { q: "13. بامعنی لفظ کے شروع میں جو حرف یا لفظ لگا کر نیا لفظ بنایا جائے، اسے کیا کہتے ہیں؟", options: ["الف) لاحقہ", "ب) سابقہ", "ج) مصدر", "د) مشتق"], answer: 1 },
    { q: "14. لفظ 'باغبان' میں 'بان' قواعد کی رو سے کیا ہے؟", options: ["الف) سابقہ", "ب) لاحقہ", "ج) حرفِ جار", "د) اسمِ ظرف"], answer: 1 },
    { q: "15. ایسی جمع جس میں واحد لفظ کی صورت یا ترتیب بدل جائے (جیسے: کتاب سے کتب)، کیا کہلاتی ہے؟", options: ["الف) جمع سالم", "ب) جمع مکسر", "ج) اسمِ جمع", "د) جمع الجمع"], answer: 1 },
    { q: "16. وہ حروف جو کچھ پوچھنے یا سوال کرنے کے لیے استعمال ہوں (جیسے: کہاں، کیوں، کب)، کیا کہلاتے ہیں؟", options: ["الف) حروفِ تاکید", "ب) حروفِ استفہام", "ج) حروفِ فجائیہ", "د) حروفِ تاسف"], answer: 1 },
    { q: "17. کلام میں پختگی یا زور پیدا کرنے کے لیے استعمال ہونے والے حروف (جیسے: ہرگز، ضرور) کیا کہلاتے ہیں؟", options: ["الف) حروفِ تاکید", "ب) حروفِ فجائیہ", "ج) حروفِ استفہام", "د) حروفِ جار"], answer: 0 },
    { q: "18. جوش یا جذبے کی حالت میں بے ساختہ زبان سے نکلنے والے الفاظ (جیسے: واہ واہ!، ماشاء اللہ!) کیا کہلاتے ہیں؟", options: ["الف) حروفِ تاسف", "ب) حروفِ فجائیہ", "ج) حروفِ تاکید", "د) حروفِ ندا"], answer: 1 },
    { q: "19. دکھ، افسوس یا حسرت کے موقع پر بولے جانے والے حروف (جیسے: افسوس!، ہائے!) کیا کہلاتے ہیں؟", options: ["الف) حروفِ فجائیہ", "ب) حروفِ تاسف", "ج) حروفِ استفہام", "د) حروفِ عطف"], answer: 1 },
    { q: "20. دو یا دو سے زیادہ بامعنی الفاظ کا مجموعہ (مثلاً: حیات بخش، راہ گزر) کیا کہلاتا ہے؟", options: ["الف) مفرد لفظ", "ب) مرکب لفظ", "ج) مہمل لفظ", "د) مترادف لفظ"], answer: 1 }
];

let currentQuestionIndex = 0;
let score = 0;

function startTest() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('score-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    const qData = grade6UrduData[currentQuestionIndex];
    document.getElementById('question-text').innerText = qData.q;
    
    const optBox = document.getElementById('options-box');
    optBox.innerHTML = '';
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optBox.appendChild(btn);
    });

    document.getElementById('progress-text').innerText = `سوال ${currentQuestionIndex + 1} از ${grade6UrduData.length}`;
    document.getElementById('feedback-box').innerHTML = '';
}

function checkAnswer(selectedIndex, btnElement) {
    const buttons = document.querySelectorAll('.opt-btn');
    buttons.forEach(b => b.disabled = true);
    
    const qData = grade6UrduData[currentQuestionIndex];
    const feedbackBox = document.getElementById('feedback-box');
    
    if (selectedIndex === qData.answer) {
        score++;
        btnElement.style.background = '#2b9348';
        btnElement.style.color = '#fff';
        btnElement.style.borderColor = '#2b9348';
        feedbackBox.innerHTML = '<span style="color: #2b9348;">✅ درست جواب!</span>';
    } else {
        btnElement.style.background = '#d90429';
        btnElement.style.color = '#fff';
        btnElement.style.borderColor = '#d90429';
        buttons[qData.answer].style.background = '#2b9348';
        buttons[qData.answer].style.color = '#fff';
        buttons[qData.answer].style.borderColor = '#2b9348';
        feedbackBox.innerHTML = '<span style="color: #d90429;">❌ غلط جواب!</span>';
    }
    
    currentQuestionIndex++;
    setTimeout(() => {
        if (currentQuestionIndex < grade6UrduData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }, 1500);
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('score-screen').style.display = 'block';
    
    const total = grade6UrduData.length;
    const percentage = Math.round((score / total) * 100);
    
    document.getElementById('total-q').innerText = `کل سوالات: ${total}`;
    document.getElementById('correct-q').innerText = `درست جوابات: ${score}`;
    document.getElementById('obtained-marks').innerText = `حاصل کردہ نمبر: ${score} / ${total}`;
    document.getElementById('percentage-score').innerText = `فیصد (Percentage): ${percentage}%`;
}

window.onload = function() {
    startTest();
};
</script>

</body>
</html>
