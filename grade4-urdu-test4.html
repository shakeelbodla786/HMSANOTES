
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HMSA Learning Academy - Grade 4 Urdu Test 4</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Noto Nastaliq Urdu', Tahoma, sans-serif;
    background: #e9eef2;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
    direction: rtl;
}

.app-container {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #0c2340, #087c59);
    color: white;
    text-align: center;
    padding: 18px 12px;
    border-bottom: 4px solid #d4af37;
}

.header h1 {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: 22px;
    direction: ltr;
}

.header h2 {
    margin: 8px 0 0;
    font-size: 19px;
    color: #f3e5ab;
    font-weight: normal;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f4f7f9;
    padding: 12px 15px;
    border-bottom: 1px solid #ccc;
    color: #0c2340;
    font-weight: bold;
    font-size: 16px;
}

.timer {
    background: #e74c3c;
    color: white;
    padding: 5px 12px;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    direction: ltr;
}

.quiz-container {
    padding: 20px;
}

.question-text {
    font-size: 21px;
    color: #222;
    margin-bottom: 20px;
    font-weight: bold;
    line-height: 2;
    text-align: right;
    direction: rtl;
}

.options-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.option-btn {
    width: 100%;
    background: #fff;
    border: 2px solid #b0c4de;
    padding: 12px 15px;
    border-radius: 9px;
    font-family: 'Noto Nastaliq Urdu', Tahoma, sans-serif;
    font-size: 18px;
    text-align: right;
    cursor: pointer;
    color: #333;
    display: flex;
    align-items: center;
    direction: rtl;
    transition: 0.3s;
    line-height: 1.9;
}

.option-btn:hover {
    background: #f0f8ff;
    border-color: #087c59;
}

.option-btn .letter {
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    background: #e8eef5;
    color: #0c2340;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    min-width: 28px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin-left: 12px;
    direction: ltr;
}

.option-btn.correct {
    background: #d4edda;
    border-color: #28a745;
    color: #155724;
}

.option-btn.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    color: #721c24;
}

.option-btn.disabled {
    pointer-events: none;
}

.next-btn {
    background: #087c59;
    color: white;
    border: none;
    padding: 13px;
    width: 100%;
    border-radius: 8px;
    font-family: 'Noto Nastaliq Urdu', sans-serif;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 22px;
    display: none;
}

.next-btn:hover {
    background: #0c2340;
}

.result-container {
    display: none;
    text-align: center;
    padding: 25px 20px;
}

.result-container h2 {
    color: #0c2340;
    font-size: 23px;
}

.score-box {
    background: #f4f7f9;
    border: 2px solid #d4af37;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.score-box p {
    font-size: 19px;
    margin: 12px 0;
    color: #333;
}

.score-box span {
    font-weight: bold;
    color: #087c59;
    font-size: 22px;
    font-family: Arial, sans-serif;
}

.restart-btn {
    background: #0c2340;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    font-family: 'Noto Nastaliq Urdu', sans-serif;
    font-size: 18px;
    cursor: pointer;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 12px;
    border-top: 1px solid #eee;
}
</style>
</head>

<body>

<div class="app-container">

    <div class="header">
        <h1>HMSA Learning Academy</h1>
        <h2>جماعت چہارم — اردو ٹیسٹ نمبر 4</h2>
    </div>

    <div class="top-bar">
        <div id="question-progress">سوال 1 / 20</div>
        <div class="timer" id="timer">05:00</div>
    </div>

    <div class="quiz-container" id="quiz-section">

        <div class="question-text" id="question-text">
            لوڈ ہو رہا ہے...
        </div>

        <div class="options-container" id="options-container"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">
            اگلا سوال
        </button>

    </div>

    <div class="result-container" id="result-section">

        <h2>ٹیسٹ مکمل ہو گیا! 🎉</h2>

        <div class="score-box">
            <p>کل سوالات: <span>20</span></p>
            <p>درست جوابات: <span id="correct-count">0</span></p>
            <p>غلط جوابات: <span id="wrong-count">0</span></p>
            <p>پرسنٹیج: <span id="percentage">0%</span></p>
        </div>

        <button class="restart-btn" onclick="location.reload()">
            دوبارہ ٹیسٹ دیں
        </button>

    </div>

    <div class="footer">
        HMSA Learning Academy | Grade 4 Urdu
    </div>

</div>

<script>

// جماعت چہارم اردو کے 20 MCQs

const questions = [

{
q: "لفظ 'عجیب' کا مترادف کیا ہے؟",
options: ["انوکھا", "خوبصورت", "بڑا", "چھوٹا"],
correct: 0
},

{
q: "'بے چینی' کا متضاد لفظ کیا ہے؟",
options: ["سکون", "پریشانی", "بے آرامی", "بے سکونی"],
correct: 0
},

{
q: "لفظ 'کتاب' کی جمع کیا ہے؟",
options: ["کتب", "کتابیں", "کتابے", "کتابوں"],
correct: 1
},

{
q: "لفظ 'مور' کی مونث کیا ہے؟",
options: ["مورنی", "موری", "موراں", "موریں"],
correct: 0
},

{
q: "'ہاتھ ملنا' محاورے کا کیا مطلب ہے؟",
options: ["پچھتانا", "خوش ہونا", "ملنا جلنا", "لڑنا"],
correct: 0
},

{
q: "'آنکھ کا تارا' محاورے کا کیا مطلب ہے؟",
options: ["بہت پیارا", "بہت دور", "بہت مشکل", "بہت آسان"],
correct: 0
},

{
q: "'واہ! کتنا خوبصورت منظر ہے۔' یہ کس قسم کا جملہ ہے؟",
options: ["فجائیہ", "استفہامیہ", "خبریہ", "امریہ"],
correct: 0
},

{
q: "'کیا تم اسکول جا رہے ہو؟' یہ کون سا جملہ ہے؟",
options: ["استفہامیہ", "فجائیہ", "ندائیہ", "خبریہ"],
correct: 0
},

{
q: "درج ذیل میں سے کون سا اسمِ آلہ ہے؟",
options: ["چاقو", "لڑکا", "کتاب", "پہاڑ"],
correct: 0
},

{
q: "'امی نے کھانا کھایا۔' اس جملے میں فعل کون سا ہے؟",
options: ["کھایا", "کھانا", "امی", "نے"],
correct: 0
},

{
q: "'بچوں نے میدان میں کھیلا۔' اس جملے میں فعل کا زمانہ کیا ہے؟",
options: ["فعل ماضی", "فعل حال", "فعل مستقبل", "فعل امر"],
correct: 0
},

{
q: "'میں کل اپنا سبق یاد کروں گا۔' یہ کون سا زمانہ ہے؟",
options: ["فعل مستقبل", "فعل ماضی", "فعل حال", "فعل نہی"],
correct: 0
},

{
q: "درج ذیل میں سے کون سا حرفِ جار ہے؟",
options: ["پر", "میز", "کھانا", "خوبصورت"],
correct: 0
},

{
q: "'علی ایک ہوشیار لڑکا ہے۔' اس جملے میں صفت کون سا لفظ ہے؟",
options: ["ہوشیار", "علی", "لڑکا", "ہے"],
correct: 0
},

{
q: "لفظ 'دن' کا متضاد کیا ہے؟",
options: ["رات", "صبح", "شام", "دوپہر"],
correct: 0
},

{
q: "لفظ 'خوشی' کا متضاد کیا ہے؟",
options: ["غم", "مسرت", "شادمانی", "خوش دلی"],
correct: 0
},

{
q: "لفظ 'استاد' کی جمع کیا ہے؟",
options: ["اساتذہ", "استادی", "استادوں", "استادیں"],
correct: 0
},

{
q: "'باغ میں پھول کھلتے ہیں۔' اس جملے میں اسم کون سا لفظ ہے؟",
options: ["باغ", "کھلتے", "ہیں", "میں"],
correct: 0
},

{
q: "جملے کے آخر میں سوالیہ نشان کون سا ہوتا ہے؟",
options: ["؟", "۔", "،", "!"],
correct: 0
},

{
q: "لفظ 'سچ' کا متضاد کیا ہے؟",
options: ["جھوٹ", "حق", "درست", "حقیقت"],
correct: 0
}

];


// بنیادی متغیرات

let currentQuestion = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let answered = false;
let timeLeft = 300;
let timerInterval;


// درست جواب کی پوزیشنز بنانا
// A، B، C، D ہر ایک پانچ مرتبہ آئے گا

function createAnswerPositions() {

    let positions = [];

    for (let i = 0; i < 5; i++) {
        positions.push(0, 1, 2, 3);
    }

    // مکمل شفلنگ

    for (let i = positions.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [positions[i], positions[j]] =
        [positions[j], positions[i]];

    }

    // مسلسل ایک جیسی پوزیشن روکنا

    for (let i = 1; i < positions.length; i++) {

        if (positions[i] === positions[i - 1]) {

            let swapIndex = -1;

            for (let j = i + 1; j < positions.length; j++) {

                if (positions[j] !== positions[i - 1] &&
                    positions[j] !== positions[i]) {

                    swapIndex = j;
                    break;

                }

            }

            if (swapIndex !== -1) {

                [positions[i], positions[swapIndex]] =
                [positions[swapIndex], positions[i]];

            } else {

                // ضرورت پڑنے پر دوبارہ ترتیب بنائیں
                return createAnswerPositions();

            }

        }

    }

    return positions;

}


// تمام سوالات کے لیے پوزیشنز تیار کرنا

const answerPositions = createAnswerPositions();


// آپشنز کی شفلنگ

function shuffleOptions(question, questionIndex) {

    let correctPosition = answerPositions[questionIndex];

    let wrongOptions = question.options.filter(
        (option, index) => index !== question.correct
    );

    // غلط آپشنز کی ترتیب تبدیل کرنا

    for (let i = wrongOptions.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [wrongOptions[i], wrongOptions[j]] =
        [wrongOptions[j], wrongOptions[i]];

    }

    let options = [];
    let wrongIndex = 0;

    for (let i = 0; i < 4; i++) {

        if (i === correctPosition) {

            options.push({
                text: question.options[question.correct],
                isCorrect: true
            });

        } else {

            options.push({
                text: wrongOptions[wrongIndex],
                isCorrect: false
            });

            wrongIndex++;

        }

    }

    return options;

}


// سوال دکھانا

function loadQuestion() {

    answered = false;

    const question = questions[currentQuestion];

    document.getElementById("question-progress").innerText =
        `سوال ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("question-text").innerText = question.q;

    const container = document.getElementById("options-container");

    container.innerHTML = "";

    document.getElementById("next-btn").style.display = "none";

    const shuffledOptions = shuffleOptions(question, currentQuestion);

    const letters = ["A", "B", "C", "D"];

    shuffledOptions.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option-btn";

        const letter = document.createElement("span");

        letter.className = "letter";

        letter.innerText = letters[index];

        const text = document.createElement("span");

        text.style.fontWeight = "normal";
        text.style.color = "inherit";
        text.innerText = option.text;

        button.appendChild(letter);
        button.appendChild(text);

        button.dataset.correct = option.isCorrect ? "true" : "false";

        button.onclick = function() {
            selectOption(button);
        };

        container.appendChild(button);

    });

}


// جواب منتخب کرنا

function selectOption(selectedButton) {

    if (answered) return;

    answered = true;

    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(button => {

        button.classList.add("disabled");

        if (button.dataset.correct === "true") {
            button.classList.add("correct");
        }

    });

    if (selectedButton.dataset.correct === "true") {

        correctAnswers++;

    } else {

        wrongAnswers++;

        selectedButton.classList.add("wrong");

    }

    document.getElementById("next-btn").style.display = "block";

}


// اگلا سوال

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        finishTest();

    }

}


// ٹیسٹ مکمل کرنا

function finishTest() {

    clearInterval(timerInterval);

    document.getElementById("quiz-section").style.display = "none";

    document.querySelector(".top-bar").style.display = "none";

    document.getElementById("result-section").style.display = "block";

    const percentage = Math.round(
        (correctAnswers / questions.length) * 100
    );

    document.getElementById("correct-count").innerText =
        correctAnswers;

    document.getElementById("wrong-count").innerText =
        wrongAnswers;

    document.getElementById("percentage").innerText =
        percentage + "%";

}


// ٹائمر

function startTimer() {

    timerInterval = setInterval(function() {

        timeLeft--;

        let minutes = Math.floor(timeLeft / 60);

        let seconds = timeLeft % 60;

        document.getElementById("timer").innerText =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {

            finishTest();

        }

    }, 1000);

}


// ٹیسٹ شروع

loadQuestion();

startTimer();

</script>

</body>
</html>
