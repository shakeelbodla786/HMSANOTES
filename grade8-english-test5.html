
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 8 - HMSA Learning Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f2f7f4;
      --card: #ffffff;
      --primary: #0f5132;
      --primary-light: #198754;
      --accent: #b45309;
      --text: #15221b;
      --muted: #56685f;
      --border: #d5e2db;
      --correct-bg: #15803d;
      --correct-soft: #dcfce7;
      --wrong-bg: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px 48px;
      background: linear-gradient(180deg, #e6f0ea 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Poppins", sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .header-box {
      background: linear-gradient(135deg, var(--primary) 0%, #1d6f48 100%);
      color: #fff;
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 10px 26px rgba(15, 81, 50, 0.16);
      text-align: center;
      margin-bottom: 18px;
    }

    .main-title {
      margin: 0 0 6px;
      font-size: 1.7rem;
      font-weight: 700;
    }

    .sub-title {
      margin: 0;
      font-size: 0.98rem;
      opacity: 0.92;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .timer-box {
      background: #fffbeb;
      border: 1.5px solid #f59e0b;
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
    }

    .btn {
      font-family: "Poppins", sans-serif;
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-home {
      background: #eef5f0;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-home:hover {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary {
      background: var(--primary-light);
      color: #fff;
    }

    .progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 18px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: #e4ede8;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--primary-light), #22c55e);
      transition: width 0.35s ease;
    }

    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 8px 24px rgba(15, 81, 50, 0.07);
    }

    .question-text {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 20px;
      padding-bottom: 14px;
      border-bottom: 1.5px dashed var(--border);
    }

    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #f8fbf9;
      color: var(--text);
      border: 1.8px solid #c9d8d0;
      border-radius: 11px;
      padding: 12px 16px;
      font-family: "Poppins", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-light);
      background: #edf7f1;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-bg);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-bg);
      color: #ffffff;
    }

    .auto-next-note {
      min-height: 26px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 14px;
    }

    .card-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .result-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(15, 81, 50, 0.08);
    }

    .result-score {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin: 10px 0;
    }

    .percentage-badge {
      display: inline-block;
      background: var(--correct-soft);
      color: var(--correct-bg);
      border: 1.5px solid var(--correct-bg);
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0 24px;
    }

    .stat-card {
      background: #f6faf8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .main-title { font-size: 1.35rem; }
      .question-text { font-size: 1.05rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header-box">
      <h1 class="main-title">Grade 8 - HMSA Learning Academy</h1>
      <p class="sub-title">English Grammar Test 4 (20 MCQs - Advanced Level)</p>
    </header>

    <div class="top-bar">
      <div class="timer-box" id="timerDisplay">Time: 05:00</div>
      <button type="button" class="btn btn-home" onclick="goHomePage()">Home Page</button>
    </div>

    <div class="progress-wrap" id="progressSection">
      <div class="progress-meta">
        <span id="questionCounter">Question 1 of 20</span>
        <span id="scorePreview">Score: 0</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <main class="quiz-card" id="quizCard">
      <h2 class="question-text" id="questionText"></h2>

      <div class="options-list" id="optionsList"></div>

      <div class="auto-next-note" id="autoNextNote"></div>

      <div class="card-footer-actions">
        <button type="button" class="btn btn-home" onclick="goHomePage()">
          Back to Home Page
        </button>
      </div>
    </main>

    <section class="result-box" id="resultBox">
      <h2 style="margin: 0; font-size: 1.55rem; color: var(--primary);">
        Test Completed - Result Card
      </h2>

      <div class="result-score" id="finalScoreText"></div>
      <div class="percentage-badge" id="percentageText"></div>

      <div class="stats-grid">
        <div class="stat-card" style="color: var(--correct-bg);" id="correctCountBox"></div>
        <div class="stat-card" style="color: var(--wrong-bg);" id="wrongCountBox"></div>
        <div class="stat-card" style="color: var(--muted);" id="unansweredCountBox"></div>
      </div>

      <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <button type="button" class="btn btn-primary" onclick="restartTest()">
          Restart Test
        </button>

        <button type="button" class="btn btn-home" onclick="goHomePage()">
          Back to Home Page
        </button>
      </div>
    </section>

  </div>

  <script>
    const HOME_URL = "index.html";

    // Test duration: 5 minutes
    const TEST_DURATION = 5 * 60;

    const questions = [
      {
        q: "1. What is the correct passive voice of 'She eats a mango.'?",
        options: [
          "A mango is eaten by her.",
          "A mango was eaten by her.",
          "A mango is ate by her.",
          "A mango has eaten by her."
        ],
        answer: 0
      },
      {
        q: "2. Which helping verbs are used in Present Indefinite Passive Voice?",
        options: [
          "is, am, are + 3rd form",
          "was, were + 3rd form",
          "will be, shall be + 3rd form",
          "has, have + 3rd form"
        ],
        answer: 0
      },
      {
        q: "3. Which helping verbs are used in Past Indefinite Passive Voice?",
        options: [
          "is, are + 3rd form",
          "was, were + 3rd form",
          "will be + 3rd form",
          "am + 3rd form"
        ],
        answer: 1
      },
      {
        q: "4. Which helping verbs are used in Future Indefinite Passive Voice?",
        options: [
          "is, are + 3rd form",
          "was, were + 3rd form",
          "will be, shall be + 3rd form",
          "have + 3rd form"
        ],
        answer: 2
      },
      {
        q: "5. What is the plural of 'story' (consonant + y)?",
        options: [
          "storys",
          "stories",
          "storyes",
          "storyies"
        ],
        answer: 1
      },
      {
        q: "6. What is the plural of 'toy' (vowel + y)?",
        options: [
          "toies",
          "toys",
          "toyes",
          "toyis"
        ],
        answer: 1
      },
      {
        q: "7. What is the plural of 'wife' (ending in 'fe')?",
        options: [
          "wifes",
          "wives",
          "wifves",
          "wivees"
        ],
        answer: 1
      },
      {
        q: "8. What is the plural of 'roof'?",
        options: [
          "rooves",
          "roofs",
          "roofes",
          "roofies"
        ],
        answer: 1
      },
      {
        q: "9. What is the plural of 'potato'?",
        options: [
          "potatos",
          "potatoes",
          "potatoies",
          "potatoos"
        ],
        answer: 1
      },
      {
        q: "10. What is the plural of 'piano'?",
        options: [
          "pianoes",
          "pianos",
          "pianies",
          "pianoos"
        ],
        answer: 1
      },
      {
        q: "11. What is the feminine form of 'actor'?",
        options: [
          "actoress",
          "actress",
          "actorine",
          "actrix"
        ],
        answer: 1
      },
      {
        q: "12. What is the feminine form of 'fox'?",
        options: [
          "foxess",
          "vixen",
          "doe",
          "mare"
        ],
        answer: 1
      },
      {
        q: "13. What is the traditional feminine form of 'author'?",
        options: [
          "authoress",
          "authorine",
          "authora",
          "authorss"
        ],
        answer: 0
      },
      {
        q: "14. What is the feminine form of 'baron'?",
        options: [
          "barona",
          "baroness",
          "baronine",
          "baroress"
        ],
        answer: 1
      },
      {
        q: "15. What is the feminine form of 'count'?",
        options: [
          "countess",
          "counta",
          "countine",
          "countress"
        ],
        answer: 0
      },
      {
        q: "16. 'The naughty children were punished.' is an example of:",
        options: [
          "Past Indefinite Passive Voice",
          "Present Indefinite Active",
          "Future Indefinite Passive",
          "Present Continuous Active"
        ],
        answer: 0
      },
      {
        q: "17. 'This room will be decorated.' is an example of:",
        options: [
          "Present Indefinite Passive",
          "Past Indefinite Passive",
          "Future Indefinite Passive",
          "Present Perfect Active"
        ],
        answer: 2
      },
      {
        q: "18. 'Are the trees cut?' is an interrogative sentence in:",
        options: [
          "Present Indefinite Passive Voice",
          "Past Indefinite Active Voice",
          "Future Indefinite Passive",
          "Imperative Mood"
        ],
        answer: 0
      },
      {
        q: "19. What is the plural of 'knife'?",
        options: [
          "knifes",
          "knives",
          "knifves",
          "knivees"
        ],
        answer: 1
      },
      {
        q: "20. What is the plural of 'box'?",
        options: [
          "boxs",
          "boxes",
          "boxies",
          "boxen"
        ],
        answer: 1
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let wrongCount = 0;
    let answered = false;
    let testFinished = false;

    let autoNextTimer = null;
    let countdownInterval = null;
    let totalSeconds = TEST_DURATION;

    // Stores the shuffled options and their original positions
    let displayedOptions = [];

    function goHomePage() {
      window.location.href = HOME_URL;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;

      return `Time: ${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // Fisher-Yates shuffle
    function shuffleOptions(options) {
      const shuffled = options.map((text, originalIndex) => ({
        text: text,
        originalIndex: originalIndex
      }));

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function startCountdown() {
      clearInterval(countdownInterval);

      document.getElementById("timerDisplay").textContent =
        formatTime(totalSeconds);

      countdownInterval = setInterval(() => {
        if (testFinished) {
          clearInterval(countdownInterval);
          return;
        }

        totalSeconds--;

        document.getElementById("timerDisplay").textContent =
          formatTime(Math.max(0, totalSeconds));

        if (totalSeconds <= 0) {
          clearInterval(countdownInterval);
          showResult();
        }
      }, 1000);
    }

    function renderQuestion() {
      if (testFinished) return;

      clearTimeout(autoNextTimer);
      answered = false;

      const item = questions[currentIndex];

      document.getElementById("questionCounter").textContent =
        `Question ${currentIndex + 1} of ${questions.length}`;

      document.getElementById("scorePreview").textContent =
        `Score: ${score}`;

      document.getElementById("progressFill").style.width =
        `${((currentIndex + 1) / questions.length) * 100}%`;

      document.getElementById("questionText").textContent = item.q;

      document.getElementById("autoNextNote").textContent = "";

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";

      // Shuffle options without losing the original correct answer
      displayedOptions = shuffleOptions(item.options);

      displayedOptions.forEach((opt, displayedIndex) => {
        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = opt.text;

        btn.addEventListener("click", () => {
          handleAnswer(displayedIndex, btn);
        });

        optionsList.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, clickedBtn) {
      if (answered || testFinished) return;

      answered = true;

      const correctOriginalIndex = questions[currentIndex].answer;

      // Find the correct answer's new shuffled position
      const correctDisplayedIndex = displayedOptions.findIndex(
        option => option.originalIndex === correctOriginalIndex
      );

      const allBtns = document.querySelectorAll(".option-btn");

      allBtns.forEach(btn => {
        btn.disabled = true;
      });

      if (selectedIdx === correctDisplayedIndex) {
        clickedBtn.classList.add("correct");

        score++;

        document.getElementById("scorePreview").textContent =
          `Score: ${score}`;

        document.getElementById("autoNextNote").textContent =
          "Correct! Moving to next question automatically...";
      } else {
        clickedBtn.classList.add("wrong");

        allBtns[correctDisplayedIndex].classList.add("correct");

        wrongCount++;

        document.getElementById("autoNextNote").textContent =
          "Incorrect! Correct option is highlighted in green. Moving next...";
      }

      autoNextTimer = setTimeout(() => {
        if (testFinished) return;

        if (currentIndex + 1 < questions.length) {
          currentIndex++;
          renderQuestion();
        } else {
          showResult();
        }
      }, 1150);
    }

    function showResult() {
      if (testFinished) return;

      testFinished = true;

      clearInterval(countdownInterval);
      clearTimeout(autoNextTimer);

      document.getElementById("quizCard").style.display = "none";
      document.getElementById("progressSection").style.display = "none";
      document.getElementById("resultBox").style.display = "block";

      const attempted = score + wrongCount;

      const unanswered = Math.max(
        0,
        questions.length - attempted
      );

      const percentage = (
        (score / questions.length) * 100
      ).toFixed(1);

      document.getElementById("finalScoreText").textContent =
        `Total Score: ${score} / ${questions.length}`;

      document.getElementById("percentageText").textContent =
        `Percentage: ${percentage}%`;

      document.getElementById("correctCountBox").textContent =
        `Correct: ${score}`;

      document.getElementById("wrongCountBox").textContent =
        `Wrong: ${wrongCount}`;

      document.getElementById("unansweredCountBox").textContent =
        `Unanswered: ${unanswered}`;
    }

    function restartTest() {
      clearInterval(countdownInterval);
      clearTimeout(autoNextTimer);

      currentIndex = 0;
      score = 0;
      wrongCount = 0;
      answered = false;
      testFinished = false;
      totalSeconds = TEST_DURATION;

      document.getElementById("quizCard").style.display = "block";
      document.getElementById("progressSection").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      startCountdown();
      renderQuestion();
    }

    // Start the test
    startCountdown();
    renderQuestion();
  </script>
</body>
</html>
