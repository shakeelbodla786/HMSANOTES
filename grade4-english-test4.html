<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMSA Learning Academy - Grade 4 English Test 4</title>
<style>
    /* بنیادی ڈیزائن */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #e9eef2;
        margin: 0;
        padding: 15px;
        display: flex;
        justify-content: center;
    }
    .app-container {
        width: 100%;
        max-width: 550px;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    
    /* ہیڈر */
    .header {
        background: linear-gradient(135deg, #0c2340 0%, #087c59 100%);
        color: white;
        text-align: center;
        padding: 15px;
        border-bottom: 4px solid #d4af37;
    }
    .header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
    }
    .header h2 {
        margin: 5px 0 0 0;
        font-size: 18px;
        color: #f3e5ab;
        font-weight: normal;
    }

    /* ٹائمر اور سوال نمبر */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f4f7f9;
        padding: 10px 15px;
        border-bottom: 1px solid #ccc;
        font-weight: bold;
        color: #0c2340;
        font-size: 16px;
    }
    .timer {
        background: #e74c3c;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 15px;
    }

    /* سوال کا خانہ */
    .quiz-container {
        padding: 20px;
    }
    .question-text {
        font-size: 18px;
        color: #333;
        margin-bottom: 20px;
        font-weight: 600;
        line-height: 1.5;
    }

    /* آپشنز */
    .options-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .option-btn {
        background: #fff;
        border: 2px solid #b0c4de;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 16px;
        text-align: left;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #333;
        display: flex;
        align-items: center;
    }
    .option-btn:hover {
        background: #f0f8ff;
        border-color: #087c59;
    }
    .option-btn span {
        font-weight: bold;
        margin-right: 10px;
        color: #0c2340;
        min-width: 25px;
    }
    
    /* صحیح اور غلط کے رنگ */
    .option-btn.correct {
        background-color: #d4edda;
        border-color: #28a745;
        color: #155724;
    }
    .option-btn.wrong {
        background-color: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
    }
    .option-btn.disabled {
        pointer-events: none;
        opacity: 0.8;
    }

    /* بٹن */
    .next-btn {
        background: #087c59;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
        display: none;
        transition: 0.3s;
    }
    .next-btn:hover {
        background: #0c2340;
    }
.home-btn {
    display: block;
    background: linear-gradient(135deg, #d4af37, #a8751c);
    color: white;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    transition: 0.3s;
}

.home-btn:hover {
    background: #0c2340;
}
    /* نتیجہ */
    .result-container {
        display: none;
        text-align: center;
        padding: 30px 20px;
    }
    .result-container h2 {
        color: #0c2340;
        margin-bottom: 20px;
    }
    .score-box {
        background: #f4f7f9;
        border: 2px solid #d4af37;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
    }
    .score-box p {
        font-size: 18px;
        margin: 10px 0;
        color: #333;
    }
    .score-box span {
        font-weight: bold;
        color: #087c59;
        font-size: 22px;
    }
</style>
</head>
<body>

<div class="app-container">
    <!-- ہیڈر -->
    <div class="header">
        <h1>HMSA Learning Academy</h1>
        <h2>Grade 4 English - Test 4</h2>
    </div>

    <!-- ٹائمر اور سوال نمبر -->
    <div class="top-bar">
        <div id="question-progress">Question 1 of 20</div>
        <div class="timer" id="timer">05:00</div>
    </div>

    <!-- کوئز کا حصہ -->
    <div class="quiz-container" id="quiz-section">
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-container" id="options-container">
            <!-- آپشنز یہاں آئیں گے -->
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
        <a href="index.html" class="home-btn">🏠 Back to Home Page</a>
    </div>

    <!-- نتیجہ کا حصہ -->
    <div class="result-container" id="result-section">
        <h2>Test Completed! 🎉</h2>
        <div class="score-box">
            <p>Total Questions: <span>20</span></p>
            <p>Correct Answers: <span id="correct-count">0</span></p>
            <p>Wrong Answers: <span id="wrong-count">0</span></p>
            <p>Percentage: <span id="percentage">0%</span></p>
        </div>
        <button class="next-btn" style="display:block;" onclick="location.reload()">Restart Test 🔄</button>
        <a href="index.html" class="home-btn">🏠 Back to Home Page</a>
    </div>
</div>

<script>
    // 20 مختلف سوالات کا ڈیٹا (ہر سوال کا ٹاپک الگ ہے)
    const questions = [
        {
            q: "Choose the word with a Long Vowel Sound:",
            options: ["cat", "brave", "sit", "hot"],
            correct: 1 // brave (Long 'a')
        },
        {
            q: "Choose the word with a Short Vowel Sound:",
            options: ["boat", "sheep", "pill", "cube"],
            correct: 2 // pill (Short 'i')
        },
        {
            q: "Identify the Compound Word in the following options:",
            options: ["beautiful", "butterfly", "quickly", "running"],
            correct: 1 // butterfly (butter + fly)
        },
        {
            q: "What is the correct pronoun to replace 'Ali' in the sentence: '___ is my best friend.'?",
            options: ["She", "It", "He", "They"],
            correct: 2 // He
        },
        {
            q: "Choose the correct Object Pronoun: 'I play cricket with ___.'",
            options: ["he", "him", "his", "they"],
            correct: 1 // him
        },
        {
            q: "Identify the helping verb in the sentence: 'She is writing a story.'",
            options: ["She", "is", "writing", "story"],
            correct: 1 // is
        },
        {
            q: "Identify the main verb in the sentence: 'They have bought a house.'",
            options: ["They", "have", "bought", "house"],
            correct: 2 // bought
        },
        {
            q: "Choose the correct adjective to complete the sentence: 'It was a very ___ day.'",
            options: ["bright", "run", "quickly", "jump"],
            correct: 0 // bright
        },
        {
            q: "Which of the following is a Proper Noun?",
            options: ["city", "river", "Lahore", "boy"],
            correct: 2 // Lahore
        },
        {
            q: "Which of the following is a Common Noun?",
            options: ["Pakistan", "Allama Iqbal", "book", "Monday"],
            correct: 2 // book
        },
        {
            q: "Choose the correct punctuation mark for the end of this sentence: 'What is your name'",
            options: [". (Full stop)", "? (Question mark)", "! (Exclamation mark)", ", (Comma)"],
            correct: 1 // Question mark
        },
        {
            q: "Choose the correct spelling:",
            options: ["sacrifice", "sacrifise", "sacerfice", "sacrifiece"],
            correct: 0 // sacrifice
        },
        {
            q: "Choose the correct spelling:",
            options: ["artistic", "artistik", "artestik", "artisic"],
            correct: 0 // artistic
        },
        {
            q: "Choose the correct preposition: 'The cat is hiding ___ the table.'",
            options: ["in", "on", "under", "at"],
            correct: 2 // under
        },
        {
            q: "Identify the inflected ending in the word 'started':",
            options: ["s", "es", "ed", "ing"],
            correct: 2 // ed
        },
        {
            q: "Choose the correct word: 'I ___ a new bicycle yesterday.'",
            options: ["buy", "buys", "bought", "buying"],
            correct: 2 // bought
        },
        {
            q: "Choose the correct pronoun: 'These books are ___.'",
            options: ["my", "mine", "me", "I"],
            correct: 1 // mine
        },
        {
            q: "What is the plural of 'child'?",
            options: ["childs", "childes", "children", "childrens"],
            correct: 2 // children
        },
        {
            q: "Identify the verb in the sentence: 'The birds fly in the sky.'",
            options: ["birds", "fly", "in", "sky"],
            correct: 1 // fly
        },
        {
            q: "Choose the correct article: 'He is ___ honest man.'",
            options: ["a", "an", "the", "no article"],
            correct: 1 // an
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let wrongAnswers = 0;
    let timerInterval;
    let timeLeft = 300; // 5 منٹ

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('question-progress');
    const timerDisplay = document.getElementById('timer');
    const quizSection = document.getElementById('quiz-section');
    const resultSection = document.getElementById('result-section');

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endQuiz();
            }
        }, 1000);
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        const q = questions[currentQuestionIndex];
        
        questionText.textContent = `${currentQuestionIndex + 1}. ${q.q}`;
        progressText.textContent = `Question ${currentQuestionIndex + 1} of 20`;
        
        optionsContainer.innerHTML = '';
        
        // آپشنز کی شفلنگ (A, B, C, D)
        let shuffledOptions = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
        shuffledOptions.sort(() => Math.random() - 0.5);

        const letters = ['A', 'B', 'C', 'D'];

        shuffledOptions.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${letters[i]}.</span> ${opt.text}`;
            btn.onclick = () => selectOption(btn, opt.originalIndex === q.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedBtn, isCorrect) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.classList.add('disabled'));

        if (isCorrect) {
            selectedBtn.classList.add('correct'); // سبز رنگ
            score++;
        } else {
            selectedBtn.classList.add('wrong'); // سرخ رنگ
            wrongAnswers++;
            // صحیح جواب کو ہائی لائٹ کریں
            allBtns.forEach(btn => {
                if (btn.textContent.includes(questions[currentQuestionIndex].options[questions[currentQuestionIndex].correct])) {
                    btn.classList.add('correct');
                }
            });
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        quizSection.style.display = 'none';
        resultSection.style.display = 'block';

        document.getElementById('correct-count').textContent = score;
        document.getElementById('wrong-count').textContent = wrongAnswers;
        
        let percentage = (score / questions.length) * 100;
        document.getElementById('percentage').textContent = percentage.toFixed(1) + '%';
    }

    window.onload = () => {
        startTimer();
        loadQuestion();
    };
</script>

</body>
</html>
