
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 5 Math Test 4 - HMSA Learning Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f2f7f4;
  --card:#fff;
  --primary:#0f5132;
  --primary-light:#198754;
  --accent:#b45309;
  --text:#15221b;
  --muted:#56685f;
  --border:#d5e2db;
  --correct-bg:#15803d;
  --correct-soft:#dcfce7;
  --wrong-bg:#dc2626;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:20px 14px 48px;
  background:linear-gradient(180deg,#e6f0ea 0%,var(--bg) 100%);
  color:var(--text);
  font-family:"Poppins",sans-serif;
  line-height:1.7;
}

.container { max-width:820px; margin:0 auto; }

.header-box {
  background:linear-gradient(135deg,var(--primary),#1d6f48);
  color:white;
  border-radius:18px;
  padding:22px 18px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 10px 26px rgba(15,81,50,.16);
}

.main-title { margin:0 0 7px; font-size:1.55rem; font-weight:700; }
.sub-title { margin:0; font-size:.95rem; }

.urdu {
  font-family:"Noto Nastaliq Urdu",serif;
  direction:rtl;
  text-align:right;
  line-height:2.1;
}

.top-bar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 18px;
  margin-bottom:18px;
}

.timer-box {
  background:#fffbeb;
  border:1.5px solid #f59e0b;
  color:var(--accent);
  padding:6px 14px;
  border-radius:10px;
  font-weight:700;
}

.btn {
  font-family:"Poppins",sans-serif;
  border:none;
  border-radius:10px;
  padding:9px 18px;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
}

.btn-home {
  background:#eef5f0;
  color:var(--primary);
  border:1.5px solid var(--primary);
}

.btn-home:hover { background:var(--primary); color:white; }
.btn-primary { background:var(--primary-light); color:white; }

.progress-wrap {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 18px;
  margin-bottom:18px;
}

.progress-meta {
  display:flex;
  justify-content:space-between;
  font-size:.92rem;
  font-weight:600;
  color:var(--muted);
  margin-bottom:8px;
}

.progress-track {
  height:10px;
  background:#e4ede8;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  width:5%;
  background:linear-gradient(90deg,var(--primary-light),#22c55e);
  transition:width .35s ease;
}

.quiz-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px 22px;
  box-shadow:0 8px 24px rgba(15,81,50,.07);
}

.question-text {
  font-size:1.12rem;
  font-weight:600;
  margin:0 0 5px;
  padding-bottom:10px;
  border-bottom:1.5px dashed var(--border);
  direction:ltr;
  text-align:left;
}

.question-urdu {
  font-size:1.08rem;
  font-weight:500;
  margin:0 0 18px;
  padding-bottom:12px;
  border-bottom:1.5px dashed var(--border);
}

.options-list {
  display:grid;
  grid-template-columns:1fr;
  gap:11px;
  margin-bottom:18px;
}

.option-btn {
  width:100%;
  min-height:52px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:stretch;
  background:#f8fbf9;
  color:var(--text);
  border:1.8px solid #c9d8d0;
  border-radius:11px;
  padding:10px 16px;
  font-family:"Poppins",sans-serif;
  font-size:1rem;
  font-weight:500;
  cursor:pointer;
  text-align:left;
}

.option-btn:hover:not(:disabled) {
  border-color:var(--primary-light);
  background:#edf7f1;
}

.option-btn:disabled { cursor:default; }

.option-btn.correct {
  background:var(--correct-bg);
  border-color:var(--correct-bg);
  color:white;
}

.option-btn.wrong {
  background:var(--wrong-bg);
  border-color:var(--wrong-bg);
  color:white;
}

.option-en {
  direction:ltr;
  text-align:left;
  display:block;
}

.option-ur {
  direction:rtl;
  text-align:right;
  display:block;
  font-family:"Noto Nastaliq Urdu",serif;
  font-size:1rem;
  line-height:2;
}

.option-numeric {
  text-align:center;
  direction:ltr;
  font-size:1.08rem;
  font-weight:600;
}

.auto-next-note {
  min-height:28px;
  font-size:.9rem;
  font-weight:600;
  color:var(--primary);
  margin-bottom:14px;
}

.card-footer-actions {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding-top:14px;
  border-top:1px solid var(--border);
}

.result-box {
  display:none;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 10px 26px rgba(15,81,50,.08);
}

.result-score {
  font-size:2rem;
  font-weight:700;
  color:var(--primary);
  margin:10px 0;
}

.percentage-badge {
  display:inline-block;
  background:var(--correct-soft);
  color:var(--correct-bg);
  border:1.5px solid var(--correct-bg);
  padding:6px 20px;
  border-radius:999px;
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:16px;
}

.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0 24px;
}

.stat-card {
  background:#f6faf8;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  font-weight:700;
}

.result-urdu {
  font-family:"Noto Nastaliq Urdu",serif;
  direction:rtl;
}

@media(max-width:600px) {
  .main-title { font-size:1.25rem; }
  .question-text { font-size:1rem; }
  .question-urdu { font-size:1rem; }
  .stats-grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="container">

<header class="header-box">
  <h1 class="main-title">Grade 5 - HMSA Learning Academy</h1>
  <p class="sub-title">Math Test 4 | 20 MCQs</p>
  <p class="urdu" style="text-align:center;margin:8px 0 0;">
    جماعت پنجم - ریاضی ٹیسٹ 4
  </p>
</header>

<div class="top-bar">
  <div class="timer-box" id="timerDisplay">Time: 05:00</div>
  <button type="button" class="btn btn-home" onclick="goHomePage()">Home Page</button>
</div>

<div class="progress-wrap" id="progressSection">
  <div class="progress-meta">
    <span id="questionCounter">Question 1 of 20</span>
    <span id="scorePreview">Score: 0</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<main class="quiz-card" id="quizCard">
  <h2 class="question-text" id="questionText"></h2>
  <p class="question-urdu urdu" id="questionUrdu"></p>
  <div class="options-list" id="optionsList"></div>
  <div class="auto-next-note" id="autoNextNote"></div>

  <div class="card-footer-actions">
    <button type="button" class="btn btn-home" onclick="goHomePage()">
      Back to Home Page
    </button>
  </div>
</main>

<section class="result-box" id="resultBox">
  <h2 style="margin:0;font-size:1.55rem;color:var(--primary);">
    Test Completed - Result Card
  </h2>
  <h3 class="result-urdu">ٹیسٹ مکمل ہو گیا - نتیجہ</h3>

  <div class="result-score" id="finalScoreText"></div>
  <div class="percentage-badge" id="percentageText"></div>

  <div class="stats-grid">
    <div class="stat-card" style="color:var(--correct-bg);" id="correctCountBox"></div>
    <div class="stat-card" style="color:var(--wrong-bg);" id="wrongCountBox"></div>
    <div class="stat-card" style="color:var(--muted);" id="unansweredCountBox"></div>
  </div>

  <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
    <button type="button" class="btn btn-primary" onclick="restartTest()">Restart Test</button>
    <button type="button" class="btn btn-home" onclick="goHomePage()">Back to Home Page</button>
  </div>
</section>

</div>

<script>
const HOME_URL = "index.html";
const TEST_DURATION = 5 * 60;

const questions = [
{
q:"1. We put space after every ______ digits in numbers.",
ur:"1۔ اعداد میں ہر ______ ہندسوں کے بعد خالی جگہ دی جاتی ہے۔",
options:[
{en:"2",type:"numeric"},
{en:"3",type:"numeric"},
{en:"4",type:"numeric"},
{en:"16",type:"numeric"}
],
answer:1
},
{
q:"2. The place value of 2 in the number 985 621 is ______.",
ur:"2۔ عدد 985 621 میں ہندسے 2 کی مقامی قیمت ______ ہے۔",
options:[
{en:"2",type:"numeric"},
{en:"20",type:"numeric"},
{en:"200",type:"numeric"},
{en:"2 000",type:"numeric"}
],
answer:1
},
{
q:"3. In 856 211, the digit ______ is at the thousands place.",
ur:"3۔ عدد 856 211 میں ہزاروں کی جگہ پر ہندسہ ______ ہے۔",
options:[
{en:"2",type:"numeric"},
{en:"5",type:"numeric"},
{en:"6",type:"numeric"},
{en:"8",type:"numeric"}
],
answer:2
},
{
q:"4. When we multiply a whole number by ______, we put 3 zeros to its right.",
ur:"4۔ جب ہم کسی پورے عدد کو ______ سے ضرب دیتے ہیں تو اس کے دائیں طرف 3 صفر لگاتے ہیں۔",
options:[
{en:"10",type:"numeric"},
{en:"100",type:"numeric"},
{en:"1 000",type:"numeric"},
{en:"1",type:"numeric"}
],
answer:2
},
{
q:"5. When we divide a whole number ending in zero by ______, we remove one zero from its right side.",
ur:"5۔ جب ہم صفر پر ختم ہونے والے پورے عدد کو ______ سے تقسیم کرتے ہیں تو اس کے دائیں طرف سے ایک صفر ختم ہو جاتا ہے۔",
options:[
{en:"10",type:"numeric"},
{en:"100",type:"numeric"},
{en:"1 000",type:"numeric"},
{en:"1",type:"numeric"}
],
answer:0
},
{
q:"6. What is the next term in the increasing pattern 50, 100, 150, 200, ______?",
ur:"6۔ بڑھتی ہوئی ترتیب 50، 100، 150، 200، ______ میں اگلا عدد کون سا ہے؟",
options:[
{en:"220",type:"numeric"},
{en:"240",type:"numeric"},
{en:"250",type:"numeric"},
{en:"300",type:"numeric"}
],
answer:2
},
{
q:"7. The HCF of 20, 48 and 56 is ______.",
ur:"7۔ 20، 48 اور 56 کا عادِ اعظم مشترک (HCF) ______ ہے۔",
options:[
{en:"4",type:"numeric"},
{en:"3",type:"numeric"},
{en:"5",type:"numeric"},
{en:"1",type:"numeric"}
],
answer:0
},
{
q:"8. The HCF of two or more numbers having no common prime factor is always ______.",
ur:"8۔ دو یا دو سے زیادہ ایسے اعداد کا عادِ اعظم مشترک ہمیشہ ______ ہوتا ہے جن کا کوئی مشترک اوّل عامل نہ ہو۔",
options:[
{en:"1000",type:"numeric"},
{en:"100",type:"numeric"},
{en:"10",type:"numeric"},
{en:"1",type:"numeric"}
],
answer:3
},
{
q:"9. The prime factorization of 16 is ______.",
ur:"9۔ عدد 16 کے اوّل عوامل کی صورت ______ ہے۔",
options:[
{en:"2 × 8",type:"numeric"},
{en:"1 × 16",type:"numeric"},
{en:"2 × 2 × 2 × 2",type:"numeric"},
{en:"2 × 4 × 2",type:"numeric"}
],
answer:2
},
{
q:"10. The LCM of 33, 66 and 81 is ______.",
ur:"10۔ 33، 66 اور 81 کا ذواضعافِ اقل مشترک (LCM) ______ ہے۔",
options:[
{en:"1770",type:"numeric"},
{en:"1872",type:"numeric"},
{en:"1782",type:"numeric"},
{en:"1287",type:"numeric"}
],
answer:2
},
{
q:"11. The LCM of two or more distinct prime numbers is equal to their ______.",
ur:"11۔ دو یا دو سے زیادہ مختلف اوّل اعداد کا ذواضعافِ اقل مشترک ان تمام اعداد کے ______ کے برابر ہوتا ہے۔",
options:[
{en:"Prime factor",ur:"اوّل عامل",type:"word"},
{en:"Quotient",ur:"حاصلِ تقسیم",type:"word"},
{en:"Sum",ur:"حاصلِ جمع",type:"word"},
{en:"Product",ur:"حاصلِ ضرب",type:"word"}
],
answer:3
},
{
q:"12. Find the sum of 1/3 + 2/5 = ______.",
ur:"12۔ 1/3 + 2/5 کا مجموعہ معلوم کریں۔",
options:[
{en:"3/8",type:"numeric"},
{en:"11/15",type:"numeric"},
{en:"3/5",type:"numeric"},
{en:"2/15",type:"numeric"}
],
answer:1
},
{
q:"13. Subtract 2/3 − 2/9 = ______.",
ur:"13۔ 2/3 میں سے 2/9 منفی کریں۔",
options:[
{en:"1/9",type:"numeric"},
{en:"7/3",type:"numeric"},
{en:"4/9",type:"numeric"},
{en:"7/9",type:"numeric"}
],
answer:2
},
{
q:"14. The product of 3/4 and 3 is ______.",
ur:"14۔ 3/4 اور 3 کا حاصلِ ضرب ______ ہے۔",
options:[
{en:"1000",type:"numeric"},
{en:"10",type:"numeric"},
{en:"9/4",type:"numeric"},
{en:"7/9",type:"numeric"}
],
answer:2
},
{
q:"15. Adding ______ to the right of a decimal number does not affect its value.",
ur:"15۔ اعشاری عدد کے دائیں طرف ______ لگانے سے اس کی قیمت پر کوئی اثر نہیں پڑتا۔",
options:[
{en:"100",type:"numeric"},
{en:"0",type:"numeric"},
{en:"1",type:"numeric"},
{en:"10",type:"numeric"}
],
answer:1
},
{
q:"16. When we multiply a decimal by 100, we move the decimal point 2 places to the ______.",
ur:"16۔ جب ہم کسی اعشاری عدد کو 100 سے ضرب دیتے ہیں تو اعشاری نقطہ 2 جگہ ______ منتقل ہوتا ہے۔",
options:[
{en:"Left",ur:"بائیں",type:"word"},
{en:"Down",ur:"نیچے",type:"word"},
{en:"Up",ur:"اوپر",type:"word"},
{en:"Right",ur:"دائیں",type:"word"}
],
answer:3
},
{
q:"17. We represent percentage by the symbol ______.",
ur:"17۔ فیصد کو کس علامت سے ظاہر کیا جاتا ہے؟",
options:[
{en:"≤",type:"numeric"},
{en:"Φ",type:"numeric"},
{en:"÷",type:"numeric"},
{en:"%",type:"numeric"}
],
answer:3
},
{
q:"18. 20% of 540 is ______.",
ur:"18۔ 540 کا 20 فیصد ______ ہے۔",
options:[
{en:"37",type:"numeric"},
{en:"108",type:"numeric"},
{en:"27",type:"numeric"},
{en:"270",type:"numeric"}
],
answer:1
},
{
q:"19. Percentage is a special kind of fraction whose denominator is always ______.",
ur:"19۔ فیصد ایک خاص قسم کا کسر ہے جس کا مخرج ہمیشہ ______ ہوتا ہے۔",
options:[
{en:"1",type:"numeric"},
{en:"10",type:"numeric"},
{en:"100",type:"numeric"},
{en:"1 000",type:"numeric"}
],
answer:2
},
{
q:"20. What is 65 781 × 100?",
ur:"20۔ 65 781 کو 100 سے ضرب دینے پر جواب کیا ہوگا؟",
options:[
{en:"6 578 100",type:"numeric"},
{en:"657 810",type:"numeric"},
{en:"65 781 000",type:"numeric"},
{en:"657 801",type:"numeric"}
],
answer:0
}
];

let currentIndex = 0;
let score = 0;
let wrongCount = 0;
let answered = false;
let testFinished = false;
let autoNextTimer = null;
let countdownInterval = null;
let totalSeconds = TEST_DURATION;
let displayedOptions = [];

function goHomePage() {
  window.location.href = HOME_URL;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `Time: ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function shuffleOptions(options) {
  const shuffled = options.map((option,index) => ({
    ...option,
    originalIndex:index
  }));

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }

  return shuffled;
}

function startCountdown() {
  clearInterval(countdownInterval);

  document.getElementById("timerDisplay").textContent =
    formatTime(totalSeconds);

  countdownInterval = setInterval(() => {
    if (testFinished) {
      clearInterval(countdownInterval);
      return;
    }

    totalSeconds--;

    document.getElementById("timerDisplay").textContent =
      formatTime(Math.max(0,totalSeconds));

    if (totalSeconds <= 0) {
      clearInterval(countdownInterval);
      showResult();
    }
  },1000);
}

function renderQuestion() {
  if (testFinished) return;

  clearTimeout(autoNextTimer);
  answered = false;

  const item = questions[currentIndex];

  document.getElementById("questionCounter").textContent =
    `Question ${currentIndex + 1} of ${questions.length}`;

  document.getElementById("scorePreview").textContent =
    `Score: ${score}`;

  document.getElementById("progressFill").style.width =
    `${((currentIndex + 1) / questions.length) * 100}%`;

  document.getElementById("questionText").textContent = item.q;
  document.getElementById("questionUrdu").textContent = item.ur;
  document.getElementById("autoNextNote").textContent = "";

  const optionsList = document.getElementById("optionsList");
  optionsList.innerHTML = "";

  displayedOptions = shuffleOptions(item.options);

  displayedOptions.forEach((option,displayedIndex) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";

    if (option.type === "numeric") {
      const en = document.createElement("span");
      en.className = "option-en option-numeric";
      en.textContent = option.en;
      btn.appendChild(en);
    } else {
      const en = document.createElement("span");
      en.className = "option-en";
      en.textContent = option.en;
      btn.appendChild(en);

      const ur = document.createElement("span");
      ur.className = "option-ur";
      ur.textContent = option.ur;
      btn.appendChild(ur);
    }

    btn.addEventListener("click",() => {
      handleAnswer(displayedIndex,btn);
    });

    optionsList.appendChild(btn);
  });
}

function handleAnswer(selectedIdx,clickedBtn) {
  if (answered || testFinished) return;

  answered = true;

  const correctOriginalIndex = questions[currentIndex].answer;

  const correctDisplayedIndex = displayedOptions.findIndex(
    option => option.originalIndex === correctOriginalIndex
  );

  const allBtns = document.querySelectorAll(".option-btn");

  allBtns.forEach(btn => btn.disabled = true);

  if (selectedIdx === correctDisplayedIndex) {
    clickedBtn.classList.add("correct");
    score++;

    document.getElementById("scorePreview").textContent =
      `Score: ${score}`;

    document.getElementById("autoNextNote").textContent =
      "Correct! Moving to next question automatically...";
  } else {
    clickedBtn.classList.add("wrong");
    allBtns[correctDisplayedIndex].classList.add("correct");
    wrongCount++;

    document.getElementById("autoNextNote").textContent =
      "Incorrect! Correct answer is highlighted. Moving next...";
  }

  autoNextTimer = setTimeout(() => {
    if (testFinished) return;

    if (currentIndex + 1 < questions.length) {
      currentIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  },1150);
}

function showResult() {
  if (testFinished) return;

  testFinished = true;

  clearInterval(countdownInterval);
  clearTimeout(autoNextTimer);

  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressSection").style.display = "none";
  document.getElementById("resultBox").style.display = "block";

  const attempted = score + wrongCount;
  const unanswered = Math.max(0,questions.length - attempted);
  const percentage = ((score / questions.length) * 100).toFixed(1);

  document.getElementById("finalScoreText").textContent =
    `Total Score: ${score} / ${questions.length}`;

  document.getElementById("percentageText").textContent =
    `Percentage: ${percentage}%`;

  document.getElementById("correctCountBox").textContent =
    `Correct: ${score}`;

  document.getElementById("wrongCountBox").textContent =
    `Wrong: ${wrongCount}`;

  document.getElementById("unansweredCountBox").textContent =
    `Unanswered: ${unanswered}`;
}

function restartTest() {
  clearInterval(countdownInterval);
  clearTimeout(autoNextTimer);

  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  answered = false;
  testFinished = false;
  totalSeconds = TEST_DURATION;

  document.getElementById("quizCard").style.display = "block";
  document.getElementById("progressSection").style.display = "block";
  document.getElementById("resultBox").style.display = "none";

  startCountdown();
  renderQuestion();
}

startCountdown();
renderQuestion();
</script>
</body>
</html>
