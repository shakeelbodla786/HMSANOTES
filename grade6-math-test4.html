// Fisher-Yates shuffle
function shuffleArray(arr){
  const copy=arr.slice();
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

// سوالات اور آپشنز دونوں شفل ہوں گے
// درست جواب کی شناخت ہر حال میں برقرار رہے گی
function buildShuffledQuiz(){
  return shuffleArray(rawQuestions).map(item=>{
    const taggedOptions=item.options.map((opt,originalIndex)=>({
      eng:opt.eng,
      urdu:opt.urdu,
      isCorrect:originalIndex===item.correctIndex
    }));

    const shuffledOptions=shuffleArray(taggedOptions);

    return{
      topic:item.topic,
      eng:item.eng,
      urdu:item.urdu,
      options:shuffledOptions,
      answer:shuffledOptions.findIndex(opt=>opt.isCorrect)
    };
  });
}

function startTest(){
  clearInterval(timerInterval);
  clearTimeout(autoNextTimeout);

  activeQuestions=buildShuffledQuiz();
  idx=0;
  score=0;
  wrong=0;
  unanswered=0;
  answeredCurrent=false;
  finished=false;
  timeLeft=300;

  document.getElementById("score-screen").style.display="none";
  document.getElementById("quiz-screen").style.display="block";

  loadQuestion();
  startTimer();
}

// ایک ہی پانچ منٹ کا ٹائمر پورے ٹیسٹ کے لیے
function startTimer(){
  clearInterval(timerInterval);
  updateTimerDisplay();

  timerInterval=setInterval(()=>{
    if(finished)return;

    timeLeft--;
    updateTimerDisplay();

    if(timeLeft<=0){
      timeLeft=0;
      updateTimerDisplay();
      showResult();
    }
  },1000);
}

function updateTimerDisplay(){
  const m=Math.floor(timeLeft/60);
  const s=timeLeft%60;
  document.getElementById("timer").innerText=
    `${m}:${s<10?"0":""}${s}`;
}

    <div class="eng-stmt"><bdi>${idx+1}. ${q.eng}</bdi></div>
    <div class="urdu-stmt"><bdi>${idx+1}. ${q.urdu}</bdi></div>

  const box=document.getElementById("options-box");
  box.innerHTML="";

  q.options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="opt-btn";

    btn.innerHTML=`
      <span class="opt-label">${labels[i]}</span>
      <span class="opt-content">
        <span class="opt-eng"><bdi>${opt.eng}</bdi></span>
        <span class="opt-urdu"><bdi>${opt.urdu}</bdi></span>
      </span>
    `;

    btn.onclick=()=>checkAnswer(i,btn);
    box.appendChild(btn);
  });

  document.getElementById("progress-text").innerText=
    `Question ${idx+1} of ${activeQuestions.length}`;

  const feedback=document.getElementById("feedback-box");
  feedback.innerHTML="";
  feedback.style.background="transparent";
}

function checkAnswer(selectedIdx,selectedButton){
  if(finished || answeredCurrent)return;

  answeredCurrent=true;

  const buttons=document.querySelectorAll(".opt-btn");
  buttons.forEach(btn=>btn.disabled=true);

  const q=activeQuestions[idx];
  const feedback=document.getElementById("feedback-box");
  const correctOpt=q.options[q.answer];
  const correctLetter=labels[q.answer];

  if(selectedIdx===q.answer){
    score++;
    selectedButton.classList.add("correct-opt");

    feedback.style.background="#e5f7ed";
    feedback.innerHTML=`
      <span style="color:#1f8a4c">
        ✅ <bdi>Correct! (${correctLetter})</bdi>
        |
        <bdi>درست جواب! (${correctLetter})</bdi>
      </span>
    `;
  }else{
    wrong++;
    selectedButton.classList.add("wrong-opt");
    buttons[q.answer].classList.add("correct-opt");

    feedback.style.background="#fdecef";
    feedback.innerHTML=`
      <span style="color:#d90429">
        ❌ <bdi>Wrong! Correct: ${correctLetter} (${correctOpt.eng})</bdi>
        <br>
        <bdi>غلط جواب! درست آپشن: ${correctLetter} — ${correctOpt.urdu}</bdi>
      </span>
    `;
  }

  clearTimeout(autoNextTimeout);
  autoNextTimeout=setTimeout(()=>{
    if(!finished)advanceQuestion();
  },1500);
}

// Next بٹن دبانے پر اگر سوال حل نہ کیا ہو تو اسے غیر حل شدہ شمار کریں
function goNextManual(){
  if(finished)return;

  clearTimeout(autoNextTimeout);

  if(!answeredCurrent){
    unanswered++;
  }

  advanceQuestion();
}

function advanceQuestion(){
  if(finished)return;

  idx++;

  if(idx<activeQuestions.length){
    loadQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  if(finished)return;

  finished=true;
  clearInterval(timerInterval);
  clearTimeout(autoNextTimeout);

  // موجودہ سوال بھی غیر حل شدہ شمار ہو گا اگر وقت ختم ہو جائے
  if(idx<activeQuestions.length && !answeredCurrent){
    unanswered++;
  }

  // باقی تمام سوالات جو وقت ختم ہونے پر رہ گئے ہوں
  const completed=score+wrong+unanswered;
  unanswered+=Math.max(0,activeQuestions.length-completed);

  document.getElementById("quiz-screen").style.display="none";
  document.getElementById("score-screen").style.display="block";

  const total=activeQuestions.length;
  const percentage=Math.round((score/total)*100);

  document.getElementById("total-q").innerHTML=
    `<bdi>Total Questions: ${total}</bdi> | <bdi>کل سوالات: ${total}</bdi>`;

  document.getElementById("correct-q").innerHTML=
    `<bdi>Correct Answers: ${score}</bdi> | <bdi>درست جوابات: ${score}</bdi>`;

  document.getElementById("wrong-q").innerHTML=
    `<bdi>Wrong Answers: ${wrong}</bdi> | <bdi>غلط جوابات: ${wrong}</bdi>`;

  document.getElementById("unanswered-q").innerHTML=
    `<bdi>Unanswered: ${unanswered}</bdi> | <bdi>غیر حل شدہ: ${unanswered}</bdi>`;

  document.getElementById("obtained-marks").innerHTML=
    `<bdi>Obtained Marks: ${score} / ${total}</bdi> | <bdi>حاصل کردہ نمبر: ${score} / ${total}</bdi>`;

  document.getElementById("percentage-score").innerHTML=
    `<bdi>Percentage: ${percentage}%</bdi> | <bdi>فیصد: ${percentage}%</bdi>`;
}

window.onload=startTest;
</script>
</body>
</html>
