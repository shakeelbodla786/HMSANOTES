<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 English Online Test | HMSA Learning Academy</title>
<style>
:root{--navy:#102b4c;--green:#087c59;--gold:#e8c66b;--light:#f2f6f7;--red:#d90429}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#263746;padding:15px;line-height:1.6}
.container{max-width:750px;margin:auto;background:white;padding:25px;border-radius:13px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-top:5px solid var(--green);direction:ltr;text-align:left;}
h2{text-align:center;color:var(--navy);margin-bottom:5px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
.quiz-header{display:flex;justify-content:space-between;align-items:center;background:#e5f3ec;padding:10px 15px;border-radius:8px;margin-bottom:15px;font-weight:bold;color:var(--navy)}
.question{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:15px;background:#f8fcfa;padding:12px;border-radius:8px;border-left:4px solid var(--green)}
.options{display:grid;gap:10px;margin-bottom:15px}
.opt-btn{background:#fff;border:2px solid #d7e5df;padding:12px 15px;text-align:left;font-size:16px;border-radius:8px;cursor:pointer;transition:0.2s;color:#263746}
.opt-btn:hover{background:#e5f3ec;border-color:var(--green)}
#feedback-box{text-align:center;margin:10px 0;font-size:18px;font-weight:bold;min-height:30px;}
.next-btn{display:none;background:var(--navy);color:white;border:none;padding:10px 20px;font-size:16px;border-radius:8px;cursor:pointer;margin:10px auto;display:block;}
.score-box{text-align:center;display:none}
.score-box h3{color:var(--navy);font-size:26px}
.restart-btn{background:var(--navy);color:white;border:none;padding:12px 25px;font-size:16px;border-radius:8px;cursor:pointer;margin-top:15px}
.back-link{display:block;text-align:center;margin-top:20px;color:var(--green);text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div class="container">
    <h2>Grade 8 — English Online Test</h2>
    <p class="subtitle">HMSA Learning Academy — Elementary Grammar Guide[cite: 22]</p>

    <div id="quiz-screen" class="quiz-box">
        <div class="quiz-header">
            <span id="progress-text">Question 1 of 20</span>
        </div>
        <div id="question-text" class="question">Question will appear here</div>
        <div id="options-box" class="options"></div>
        <div id="feedback-box"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display:none;">Next Question ➔</button>
    </div>

    <div id="score-screen" class="score-box">
        <h3>Test Completed Successfully!</h3>
        <p style="font-size: 18px; margin: 15px 0; font-family: Tahoma, sans-serif;" dir="rtl">آپ نے جماعت آٹھویں کا انگریزی ٹیسٹ کامیابی سے مکمل کر لیا ہے۔</p>
        <button class="restart-btn" onclick="startTest()">Test Again / دوبارہ ٹیسٹ دیں</button>
    </div>

    <a class="back-link" href="index.html">← Back to Home Page / مرکزی ہوم پیج پر واپس جائیں</a>
</div>

<script>
const grade8QuizData = [
    { q: "1. Three letters coming together to produce a single sound ('tch' in match)[cite: 23]:", options: ["A) Digraph", "B) Trigraph", "C) Prefix", "D) Suffix"], answer: 1 },
    { q: "2. Words that share exact same spelling but differ in meaning and sometimes pronunciation[cite: 23]:", options: ["A) Homophones", "B) Homographs", "C) Synonyms", "D) Antonyms"], answer: 1 },
    { q: "3. Sentence containing one independent and at least one dependent clause[cite: 30]:", options: ["A) Simple", "B) Compound", "C) Complex Sentence", "D) Exclamatory"], answer: 2 },
    { q: "4. Pronouns connecting clause to noun (Who, Whom, Whose, Which, That)[cite: 25]:", options: ["A) Relative Pronouns", "B) Interrogative Pronouns", "C) Demonstrative", "D) Personal"], answer: 0 },
    { q: "5. Verb connecting subject to subject complement ('Honey tastes sweet')[cite: 27]:", options: ["A) Linking Verb", "B) Transitive Verb", "C) Modal Verb", "D) Action Verb"], answer: 0 },
    { q: "6. Modal verb expressing duty, advice, or recommendation[cite: 27]:", options: ["A) Should", "B) May", "C) Can", "D) Might"], answer: 0 },
    { q: "7. Adverb showing INTENSITY or extent ('very', 'too')[cite: 28]:", options: ["A) Adverb of Degree", "B) Adverb of Manner", "C) Time", "D) Frequency"], answer: 0 },
    { q: "8. Preposition used for months, years, seasons ('July', '2024')[cite: 29]:", options: ["A) At", "B) On", "C) In", "D) To"], answer: 2 },
    { q: "9. Conjunctions working in matching pairs (either...or, neither...nor)[cite: 30]:", options: ["A) Coordinating", "B) Subordinating", "C) Correlative Conjunctions", "D) Transitions"], answer: 2 },
    { q: "10. Punctuation mark introducing a list, explanation, or quote[cite: 30]:", options: ["A) Colon (:)", "B) Semicolon (;)", "C) Comma (,)", "D) Hyphen (-)"], answer: 0 },
    { q: "11. Tense describing action ongoing/in progress at specific past time[cite: 32]:", options: ["A) Simple Past", "B) Past Continuous Tense", "C) Past Perfect", "D) Present Cont"], answer: 1 },
    { q: "12. Tense describing action completed before another past action occurred[cite: 32]:", options: ["A) Simple Past", "B) Present Perfect", "C) Past Perfect Tense", "D) Future Perfect"], answer: 2 },
    { q: "13. Tense expressing action that will happen in future time[cite: 32]:", options: ["A) Simple Future Tense", "B) Simple Present", "C) Future Continuous", "D) Present Future"], answer: 0 },
    { q: "14. Passive helping verb for Simple Present Tense (V1/s,es)[cite: 34]:", options: ["A) was / were", "B) is/am/are", "C) has been / have been", "D) is being"], answer: 1 },
    { q: "15. Passive helping verb for Simple Past Tense (V2 / did)[cite: 34]:", options: ["A) was / were", "B) is/am/are", "C) had been", "D) was being"], answer: 0 },
    { q: "16. Which tense CANNOT be converted into Passive Voice[cite: 34]?", options: ["A) Present Perfect Continuous", "B) Simple Present", "C) Simple Past", "D) Future Perfect"], answer: 0 },
    { q: "17. If Reporting Verb is Past ('said'), Simple Present changes into[cite: 35]:", options: ["A) Simple Past Tense", "B) Past Perfect", "C) Present Cont", "D) Past Cont"], answer: 0 },
    { q: "18. In Indirect speech, modal 'will / shall' changes into[cite: 35]:", options: ["A) would/ should", "B) can/ may", "C) must", "D) could"], answer: 0 },
    { q: "19. Word formed by rearranging exact letters of another ('Silent' -> 'Listen')[cite: 36]:", options: ["A) Anagram", "B) Acronym", "C) Abbreviation", "D) Antonym"], answer: 0 },
    { q: "20. Word formed from initial letters and spoken as word ('NASA', 'RAM')[cite: 37]:", options: ["A) Acronym", "B) Abbreviation", "C) Homograph", "D) Syllable"], answer: 0 }
];

let currentQuestionIndex = 0;

function startTest() {
    currentQuestionIndex = 0;
    document.getElementById('score-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    const qData = grade8QuizData[currentQuestionIndex];
    document.getElementById('question-text').innerText = qData.q;
    
    const optBox = document.getElementById('options-box');
    optBox.innerHTML = '';
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optBox.appendChild(btn);
    });

    document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${grade8QuizData.length}`;
    document.getElementById('feedback-box').innerHTML = '';
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(selectedIndex, btnElement) {
    const buttons = document.querySelectorAll('.opt-btn');
    buttons.forEach(b => b.disabled = true);
    
    const qData = grade8QuizData[currentQuestionIndex];
    const feedbackBox = document.getElementById('feedback-box');
    
    if (selectedIndex === qData.answer) {
        btnElement.style.background = '#2b9348';
        btnElement.style.color = '#fff';
        feedbackBox.innerHTML = '<span style="color: #2b9348;">✅ درست جواب! (Correct Answer)</span>';
    } else {
        btnElement.style.background = '#d90429';
        btnElement.style.color = '#fff';
        buttons[qData.answer].style.background = '#2b9348';
        buttons[qData.answer].style.color = '#fff';
        feedbackBox.innerHTML = '<span style="color: #d90429;">❌ غلط جواب! (Incorrect Answer)</span>';
    }
    
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < grade8QuizData.length) {
        loadQuestion();
    } else {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('score-screen').style.display = 'block';
    }
}

window.onload = function() {
    startTest();
};
</script>

</body>
</html>
