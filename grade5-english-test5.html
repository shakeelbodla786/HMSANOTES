
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Five English Test 5 | HMSA Learning Academy</title>
  <style>
    :root {
      --bg: #f2f7f4;
      --card: #ffffff;
      --primary: #0f5132;
      --primary-light: #198754;
      --accent: #b45309;
      --text: #16221c;
      --muted: #55665e;
      --border: #d4e0da;
      --correct-bg: #15803d;
      --correct-soft: #dcfce7;
      --wrong-bg: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px 48px;
      background: linear-gradient(180deg, #e7f0eb 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    .header-box {
      background: linear-gradient(135deg, var(--primary) 0%, #1c6e47 100%);
      color: #fff;
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 10px 26px rgba(15, 81, 50, 0.16);
      text-align: center;
      margin-bottom: 18px;
    }

    .main-title {
      margin: 0 0 6px;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .sub-title { margin: 0; font-size: 1rem; opacity: 0.95; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .timer-box {
      background: #fffbeb;
      border: 1.5px solid #f59e0b;
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .btn {
      font-family: inherit;
      border: none;
      border-radius: 11px;
      padding: 9px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-home {
      background: #eef4f0;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-home:hover { background: var(--primary); color: #fff; }

    .btn-primary { background: var(--primary-light); color: #fff; }

    .progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 18px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: #e5ece8;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--primary-light), #22c55e);
      transition: width 0.35s ease;
    }

    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 8px 24px rgba(15, 81, 50, 0.07);
    }

    .question-text {
      font-size: 1.24rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 20px;
      padding-bottom: 12px;
      border-bottom: 1.5px dashed var(--border);
    }

    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #f8fbf9;
      color: var(--text);
      border: 1.8px solid #c9d8d0;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-light);
      background: #edf7f1;
    }

    .option-btn:disabled { cursor: default; opacity: 1; }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-bg);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-bg);
      color: #ffffff;
    }

    .auto-next-note {
      min-height: 24px;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 14px;
    }

    .card-footer-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .result-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(15, 81, 50, 0.08);
    }

    .result-score {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--primary);
      margin: 10px 0;
    }

    .percentage-badge {
      display: inline-block;
      background: var(--correct-soft);
      color: var(--correct-bg);
      border: 1.5px solid var(--correct-bg);
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0 24px;
    }

    .stat-card {
      background: #f6faf8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .main-title { font-size: 1.4rem; }
      .question-text { font-size: 1.1rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header-box">
      <h1 class="main-title">Grade Five — HMSA Learning Academy</h1>
      <p class="sub-title">English Test 5 (20 MCQs)</p>
    </header>

    <div class="top-bar">
      <div class="timer-box" id="timerDisplay">Time: 15:00</div>
      <button type="button" class="btn btn-home" onclick="goHomePage()">
        Back to Home Page
      </button>
    </div>

    <div class="progress-wrap" id="progressSection">
      <div class="progress-meta">
        <span id="questionCounter">Question 1 of 20</span>
        <span id="scorePreview">Score: 0</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <main class="quiz-card" id="quizCard">
      <h2 class="question-text" id="questionText"></h2>

      <div class="options-list" id="optionsList"></div>

      <div class="auto-next-note" id="autoNextNote"></div>

      <div class="card-footer-actions">
        <button type="button" class="btn btn-home" onclick="goHomePage()">
          Back to Home Page
        </button>
      </div>
    </main>

    <section class="result-box" id="resultBox">
      <h2 style="margin: 0; font-size: 1.6rem; color: var(--primary);">
        Test Completed — Result
      </h2>

      <div class="result-score" id="finalScoreText"></div>
      <div class="percentage-badge" id="percentageText"></div>

      <div class="stats-grid">
        <div class="stat-card" style="color: var(--correct-bg);" id="correctCountBox"></div>
        <div class="stat-card" style="color: var(--wrong-bg);" id="wrongCountBox"></div>
        <div class="stat-card" style="color: var(--muted);" id="unansweredCountBox"></div>
      </div>

      <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <button type="button" class="btn btn-primary" onclick="restartTest()">
          Try Again
        </button>

        <button type="button" class="btn btn-home" onclick="goHomePage()">
          Back to Home Page
        </button>
      </div>
    </section>

  </div>

  <script>
    const HOME_URL = "index.html";

    const rawQuestions = [
      { q: "1. Which word is a noun?", options: ["Run", "Apple", "Quickly", "Blue"], answer: 1 },

      { q: "2. Choose the plural of 'cat'.", options: ["Catss", "Cates", "Cats", "Cat"], answer: 2 },

      { q: "3. Which word is a pronoun?", options: ["She", "Table", "Walk", "Sweet"], answer: 0 },

      { q: "4. Fill in the blank: The sun ___ in the east.", options: ["rise", "rises", "rising", "risen"], answer: 1 },

      { q: "5. Which word is an adjective?", options: ["Happy", "Jump", "Book", "Under"], answer: 0 },

      { q: "6. Choose the correct article: ___ orange is sweet.", options: ["A", "An", "The", "Is"], answer: 1 },

      { q: "7. Which word is a verb?", options: ["Pencil", "Play", "Green", "Near"], answer: 1 },

      { q: "8. What is the opposite of 'hot'?", options: ["Big", "Cold", "Tall", "Fast"], answer: 1 },

      { q: "9. Choose the plural of 'book'.", options: ["Bookes", "Books", "Bookies", "Book"], answer: 1 },

      { q: "10. Fill in the blank: I ___ a student.", options: ["am", "is", "are", "were"], answer: 0 },

      { q: "11. Which word shows an action?", options: ["Read", "Chair", "Milk", "Soft"], answer: 0 },

      { q: "12. Choose the correct pronoun for a boy.", options: ["Her", "He", "They", "It"], answer: 1 },

      { q: "13. What is the opposite of 'up'?", options: ["In", "Down", "On", "Out"], answer: 1 },

      { q: "14. Fill in the blank: Birds ___ in the sky.", options: ["fly", "flies", "flying", "flew"], answer: 0 },

      { q: "15. Which word is a naming word (noun)?", options: ["School", "Sing", "Slow", "And"], answer: 0 },

      { q: "16. Choose the plural of 'box'.", options: ["Boxs", "Boxes", "Boxies", "Boxen"], answer: 1 },

      { q: "17. Fill in the blank: We ___ going to the park.", options: ["is", "am", "are", "was"], answer: 2 },

      { q: "18. Which word describes a noun (adjective)?", options: ["Tall", "Eat", "Go", "Boy"], answer: 0 },

      { q: "19. What is the opposite of 'day'?", options: ["Sun", "Night", "Morning", "Star"], answer: 1 },

      { q: "20. Choose the correct article: ___ moon shines at night.", options: ["A", "An", "The", "No article"], answer: 2 }
    ];

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let wrongCount = 0;
    let answered = false;
    let testFinished = false;
    let autoNextTimer = null;
    let totalSeconds = 5 * 60;
    let countdownInterval = null;

    function goHomePage() {
      window.location.href = HOME_URL;
    }

    function shuffleArray(array) {
      const copy = array.slice();

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function buildShuffledQuestions() {
      const shuffledQuestions = shuffleArray(rawQuestions);

      return shuffledQuestions.map(item => {
        const taggedOptions = item.options.map((option, index) => ({
          text: option,
          isCorrect: index === item.answer
        }));

        const shuffledOptions = shuffleArray(taggedOptions);

        return {
          q: item.q,
          options: shuffledOptions.map(option => option.text),
          answer: shuffledOptions.findIndex(option => option.isCorrect)
        };
      });
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;

      return `Time: ${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function startCountdown() {
      clearInterval(countdownInterval);

      document.getElementById("timerDisplay").textContent = formatTime(totalSeconds);

      countdownInterval = setInterval(() => {
        if (testFinished) return;

        totalSeconds--;

        document.getElementById("timerDisplay").textContent =
          formatTime(Math.max(0, totalSeconds));

        if (totalSeconds <= 0) {
          showResult();
        }
      }, 1000);
    }

    function renderQuestion() {
      clearTimeout(autoNextTimer);

      if (testFinished) return;

      answered = false;

      const item = questions[currentIndex];

      document.getElementById("questionCounter").textContent =
        `Question ${currentIndex + 1} of ${questions.length}`;

      document.getElementById("scorePreview").textContent =
        `Score: ${score}`;

      document.getElementById("progressFill").style.width =
        `${((currentIndex + 1) / questions.length) * 100}%`;

      document.getElementById("questionText").textContent = item.q;

      document.getElementById("autoNextNote").textContent = "";

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";

      item.options.forEach((option, index) => {
        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = option;

        btn.addEventListener("click", () => handleAnswer(index, btn));

        optionsList.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, clickedBtn) {
      if (answered || testFinished) return;

      answered = true;

      const correctIdx = questions[currentIndex].answer;
      const allBtns = document.querySelectorAll(".option-btn");

      allBtns.forEach(btn => {
        btn.disabled = true;
      });

      if (selectedIdx === correctIdx) {
        clickedBtn.classList.add("correct");

        score++;

        document.getElementById("scorePreview").textContent =
          `Score: ${score}`;

        document.getElementById("autoNextNote").textContent =
          "Correct! Moving to next question...";

      } else {
        clickedBtn.classList.add("wrong");

        allBtns[correctIdx].classList.add("correct");

        wrongCount++;

        document.getElementById("autoNextNote").textContent =
          "Incorrect! Correct answer highlighted in green. Moving next...";
      }

      autoNextTimer = setTimeout(() => {
        if (testFinished) return;

        if (currentIndex + 1 < questions.length) {
          currentIndex++;
          renderQuestion();
        } else {
          showResult();
        }
      }, 1100);
    }

    function showResult() {
      if (testFinished) return;

      testFinished = true;

      clearInterval(countdownInterval);
      clearTimeout(autoNextTimer);

      document.getElementById("quizCard").style.display = "none";
      document.getElementById("progressSection").style.display = "none";
      document.getElementById("resultBox").style.display = "block";

      const attempted = score + wrongCount;
      const unanswered = Math.max(0, questions.length - attempted);
      const percentage = ((score / questions.length) * 100).toFixed(1);

      document.getElementById("finalScoreText").textContent =
        `Total Score: ${score} / ${questions.length}`;

      document.getElementById("percentageText").textContent =
        `Percentage: ${percentage}%`;

      document.getElementById("correctCountBox").textContent =
        `Correct: ${score}`;

      document.getElementById("wrongCountBox").textContent =
        `Wrong: ${wrongCount}`;

      document.getElementById("unansweredCountBox").textContent =
        `Unanswered: ${unanswered}`;
    }

    function startTest() {
      clearInterval(countdownInterval);
      clearTimeout(autoNextTimer);

      currentIndex = 0;
      score = 0;
      wrongCount = 0;
      answered = false;
      testFinished = false;
      totalSeconds = 5 * 60;

      questions = buildShuffledQuestions();

      document.getElementById("quizCard").style.display = "block";
      document.getElementById("progressSection").style.display = "block";
      document.getElementById("resultBox").style.display = "none";

      startCountdown();
      renderQuestion();
    }

    function restartTest() {
      startTest();
    }

    startTest();
  </script>
</body>
</html>
