<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 7 English Online Test 2 | HMSA Learning Academy</title>
<style>
:root{--navy:#102b4c;--green:#087c59;--gold:#e8c66b;--light:#f2f6f7;--red:#d90429}
*{box-sizing:border-box}
body{margin:0;font-family:Arial, sans-serif;background:var(--light);color:#263746;padding:15px;line-height:1.6}
.container{max-width:750px;margin:auto;background:white;padding:25px;border-radius:13px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-top:5px solid var(--green);direction:ltr;text-align:left;}
h2{text-align:center;color:var(--navy);margin-bottom:5px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
.quiz-header{display:flex;justify-content:space-between;align-items:center;background:#e5f3ec;padding:10px 15px;border-radius:8px;margin-bottom:15px;font-weight:bold;color:var(--navy)}
.question{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:15px;background:#f8fcfa;padding:15px;border-radius:8px;border-left:4px solid var(--green)}
.options{display:grid;gap:10px;margin-bottom:15px}
.opt-btn{background:#fff;border:2px solid #d7e5df;padding:12px 15px;text-align:left;font-size:16px;border-radius:8px;cursor:pointer;transition:0.2s;color:#263746}
.opt-btn:hover:not(:disabled){background:#e5f3ec;border-color:var(--green)}
#feedback-box{text-align:center;margin:10px 0;font-size:18px;font-weight:bold;min-height:30px;}
.score-box{text-align:center;display:none;padding:15px 0}
.score-box h3{color:var(--navy);font-size:26px;margin-bottom:10px}
.result-card{background:#f8fcfa;border:2px solid #d7e5df;border-radius:10px;padding:20px;margin:15px auto;max-width:400px}
.result-item{font-size:18px;margin:8px 0;color:var(--navy);font-weight:bold}
.restart-btn{background:#102b4c;color:white;border:none;padding:12px 25px;font-size:16px;border-radius:8px;cursor:pointer;margin-top:15px}
.back-link{display:block;text-align:center;margin-top:20px;color:var(--green);text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div class="container">
    <h2>Grade 7 — English Online Test 2</h2>
    <p class="subtitle">HMSA Learning Academy — Grade 7 Assessment 2</p>

    <div id="quiz-screen" class="quiz-box">
        <div class="quiz-header">
            <span id="progress-text">Question 1 of 20</span>
            <span>Total Marks: 20</span>
        </div>
        <div id="question-text" class="question">Question will appear here</div>
        <div id="options-box" class="options"></div>
        <div id="feedback-box"></div>
    </div>

    <div id="score-screen" class="score-box">
        <h3>Test 2 Completed Successfully!</h3>
        <div class="result-card">
            <div class="result-item" id="total-q">Total Questions: 20</div>
            <div class="result-item" id="correct-q" style="color: #087c59;">Correct Answers: 0</div>
            <div class="result-item" id="obtained-marks">Obtained Marks: 0 / 20</div>
            <div class="result-item" id="percentage-score" style="color: #102b4c; font-size: 20px;">Percentage: 0%</div>
        </div>
        <button class="restart-btn" onclick="startTest()">Test Again / دوبارہ ٹیسٹ دیں</button>
    </div>

    <a class="back-link" href="index.html">← Back to Home Page / مرکزی ہوم پیج پر واپس جائیں</a>
</div>

<script>
const grade7EnglishTest2Data = [
    { q: "1. Which of the following is an example of a Collective Noun?", options: ["A) Ali", "B) Team", "C) Water", "D) Honesty"], answer: 1 },
    { q: "2. What is the plural form of the noun 'Country'?", options: ["A) Countrys", "B) Countris", "C) Countries", "D) Countryes"], answer: 2 },
    { q: "3. Identify the reflexive pronoun in the sentence: 'He hurt himself while playing.'", options: ["A) He", "B) himself", "C) playing", "D) while"], answer: 1 },
    { q: "4. What is the past participle (V3) form of the verb 'Write'?", options: ["A) Wrote", "B) Writed", "C) Written", "D) Writing"], answer: 2 },
    { q: "5. Which modal verb shows strong obligation or necessity?", options: ["A) Can", "B) May", "C) Must", "D) Might"], answer: 2 },
    { q: "6. Identify the adverb of manner in the sentence: 'The baby slept peacefully.'", options: ["A) baby", "B) slept", "C) peacefully", "D) The"], answer: 2 },
    { q: "7. Which prefix can be added to the word 'patient' to form its antonym?", options: ["A) Un-", "B) Im-", "C) Dis-", "D) Mis-"], answer: 1 },
    { q: "8. What is the feminine gender of the noun 'Bull'?", options: ["A) Cow", "B) Mare", "C) Vixen", "D) Duck"], answer: 0 },
    { q: "9. Complete the sentence: 'She is taller ___ her brother.'", options: ["A) as", "B) than", "C) to", "D) from"], answer: 1 },
    { q: "10. Which punctuation mark is used at the end of an exclamatory sentence?", options: ["A) Full stop (.)", "B) Question mark (?)", "C) Exclamation mark (!)", "D) Comma (,)"], answer: 2 },
    { q: "11. What type of sentence expresses a command or request?", options: ["A) Declarative", "B) Interrogative", "C) Imperative", "D) Exclamatory"], answer: 2 },
    { q: "12. Which of the following words has a silent letter?", options: ["A) Cat", "B) Dog", "C) Knife", "D) Pen"], answer: 2 },
    { q: "13. What is the synonym (similar meaning) of the word 'Brave'?", options: ["A) Coward", "B) Courageous", "C) Afraid", "D) Timid"], answer: 1 },
    { q: "14. Identify the preposition in the sentence: 'The cat is sitting under the table.'", options: ["A) cat", "B) sitting", "C) under", "D) table"], answer: 2 },
    { q: "15. Which tense is used in the sentence: 'They will visit Lahore tomorrow.'", options: ["A) Past Simple", "B) Present Indefinite", "C) Future Simple", "D) Past Continuous"], answer: 2 },
    { q: "16. What is the suffix of the word 'Agreement'?", options: ["A) Agree", "B) -ment", "C) A-", "D) -ent"], answer: 1 },
    { q: "17. Words that have opposite meanings are called:", options: ["A) Synonyms", "B) Antonyms", "C) Homophones", "D) Homographs"], answer: 1 },
    { q: "18. Which article is used before a word starting with a vowel sound?", options: ["A) A", "B) An", "C) The", "D) None"], answer: 1 },
    { q: "19. Which of the following is a material noun?", options: ["A) Silver", "B) Childhood", "C) Crowd", "D) London"], answer: 0 },
    { q: "20. What is the plural form of the noun 'Tooth'?", options: ["A) Tooths", "B) Teeth", "C) Toothses", "D) Teeths"], answer: 1 }
];

let currentQuestionIndex = 0;
let score = 0;

function startTest() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('score-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    const qData = grade7EnglishTest2Data[currentQuestionIndex];
    document.getElementById('question-text').innerText = qData.q;
    
    const optBox = document.getElementById('options-box');
    optBox.innerHTML = '';
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optBox.appendChild(btn);
    });

    document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${grade7EnglishTest2Data.length}`;
    document.getElementById('feedback-box').innerHTML = '';
}

function checkAnswer(selectedIndex, btnElement) {
    const buttons = document.querySelectorAll('.opt-btn');
    buttons.forEach(b => b.disabled = true);
    
    const qData = grade7EnglishTest2Data[currentQuestionIndex];
    const feedbackBox = document.getElementById('feedback-box');
    
    if (selectedIndex === qData.answer) {
        score++;
        btnElement.style.background = '#2b9348';
        btnElement.style.color = '#fff';
        btnElement.style.borderColor = '#2b9348';
        feedbackBox.innerHTML = '<span style="color: #2b9348;">✅ Correct Answer! (درست جواب)</span>';
    } else {
        btnElement.style.background = '#d90429';
        btnElement.style.color = '#fff';
        btnElement.style.borderColor = '#d90429';
        buttons[qData.answer].style.background = '#2b9348';
        buttons[qData.answer].style.color = '#fff';
        buttons[qData.answer].style.borderColor = '#2b9348';
        feedbackBox.innerHTML = '<span style="color: #d90429;">❌ Incorrect Answer! (غلط جواب)</span>';
    }
    
    currentQuestionIndex++;
    setTimeout(() => {
        if (currentQuestionIndex < grade7EnglishTest2Data.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }, 1500);
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('score-screen').style.display = 'block';
    
    const total = grade7EnglishTest2Data.length;
    const percentage = Math.round((score / total) * 100);
    
    document.getElementById('total-q').innerText = `Total Questions: ${total}`;
    document.getElementById('correct-q').innerText = `Correct Answers: ${score}`;
    document.getElementById('obtained-marks').innerText = `Obtained Marks: ${score} / ${total}`;
    document.getElementById('percentage-score').innerText = `Percentage: ${percentage}%`;
}

window.onload = function() {
    startTest();
};
</script>

</body>
</html>
