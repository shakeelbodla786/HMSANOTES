<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جماعت چہارم - اردو آن لائن ٹیسٹ | HMSA Learning Academy</title>
<style>
:root{--navy:#102b4c;--green:#087c59;--gold:#e8c66b;--light:#f2f6f7;--red:#d90429}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma, Arial, sans-serif;background:var(--light);color:#263746;padding:15px;line-height:1.8}
.container{max-width:750px;margin:auto;background:white;padding:25px;border-radius:13px;box-shadow:0 3px 12px rgba(0,0,0,0.1);border-top:5px solid var(--green)}
h2{text-align:center;color:var(--navy);margin-bottom:5px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
.quiz-header{display:flex;justify-content:space-between;align-items:center;background:#e5f3ec;padding:10px 15px;border-radius:8px;margin-bottom:15px;font-weight:bold;color:var(--navy)}
.question{font-size:18px;font-weight:bold;color:var(--navy);margin-bottom:15px;background:#f8fcfa;padding:15px;border-radius:8px;border-right:4px solid var(--green);text-align:right;}
.options{display:grid;gap:10px;margin-bottom:15px}
.opt-btn{background:#fff;border:2px solid #d7e5df;padding:12px 15px;text-align:right;font-size:16px;border-radius:8px;cursor:pointer;transition:0.2s;color:#263746}
.opt-btn:hover{background:#e5f3ec;border-color:var(--green)}
#feedback-box{text-align:center;margin:10px 0;font-size:18px;font-weight:bold;min-height:30px;}
.next-btn{display:none;background:var(--navy);color:white;border:none;padding:10px 20px;font-size:16px;border-radius:8px;cursor:pointer;margin:10px auto;}
.score-box{text-align:center;display:none}
.score-box h3{color:var(--navy);font-size:26px}
.restart-btn{background:var(--navy);color:white;border:none;padding:12px 25px;font-size:16px;border-radius:8px;cursor:pointer;margin-top:15px}
.back-link{display:block;text-align:center;margin-top:20px;color:var(--green);text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div class="container">
    <h2>جماعت چہارم — اردو آن لائن ٹیسٹ</h2>
    <p class="subtitle">Grade 4 Urdu Online Quiz — HMSA Learning Academy</p>

    <div id="quiz-screen" class="quiz-box">
        <div class="quiz-header">
            <span id="progress-text">سوال 1 از 20</span>
        </div>
        <div id="question-text" class="question">سوال یہاں ظاہر ہوگا</div>
        <div id="options-box" class="options"></div>
        <div id="feedback-box"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">اگلا سوال ➔</button>
    </div>

    <div id="score-screen" class="score-box">
        <h3>اردو کا ٹیسٹ مکمل ہو گیا!</h3>
        <p style="font-size: 18px; margin: 15px 0;">آپ نے جماعت چہارم کا اردو ٹیسٹ کامیابی سے مکمل کر لیا ہے۔</p>
        <button class="restart-btn" onclick="startTest()">دوبارہ ٹیسٹ شروع کریں</button>
    </div>

    <a class="back-link" href="index.html">← مرکزی ہوم پیج پر واپس جائیں</a>
</div>

<script>
const grade4UrduData = [
    { q: "1. جس نظم میں اللہ تعالیٰ کی تعریف بیان کی جائے، اسے کیا کہتے ہیں؟", options: ["الف) نعت", "ب) حمد", "ج) غزل", "د) قصیدہ"], answer: 1 },
    { q: "2. 'کتاب میز پر رکھی ہے' اس جملے میں 'پر' قواعد کی رو سے کیا ہے؟", options: ["الف) حرفِ جار", "ب) حرفِ عطف", "ج) اسمِ ضمیر", "د) فعل"], answer: 0 },
    { q: "3. ذیل میں سے کون سا لفظ 'اسمِ خاص' (اسمِ معرفہ) کی مثال ہے؟", options: ["الف) شہر", "ب) دریا", "ج) لاہور", "د) پہاڑ"], answer: 2 },
    { q: "4. ذیل میں سے کون سا لفظ 'مذکر غیر حقیقی' ہے؟", options: ["الف) شیر", "ب) قلم", "ج) گھوڑا", "د) لڑکا"], answer: 1 },
    { q: "5. لفظ 'آغاز' کا درست متضاد (الٹ) کیا ہے؟", options: ["الف) ابتدا", "ب) انجام", "ج) شروع", "د) نیا"], answer: 1 },
    { q: "6. 'وہ محنت سے پڑھتا ہے' اس جملے میں 'وہ' کیا ہے؟", options: ["الف) اسمِ ضمیر", "ب) اسمِ صفت", "ج) فعل", "د) حرف"], answer: 0 },
    { q: "7. الفاظ کو حروفِ تہجی کی ترتیب سے لکھنا کیا کہلاتا ہے؟", options: ["الف) عددی ترتیب", "ب) الف بائی ترتیب", "ج) الٹی ترتیب", "د) زمانی ترتیب"], answer: 1 },
    { q: "8. جملے میں کسی بات کی وضاحت یا اضافی معلومات کے لیے کون سی علامت لگائی جاتی ہے؟", options: ["الف) سوالیہ نشان (؟)", "ب) قوسین ( )", "ج) ختمہ (۔)", "د) ندائیہ (!)"], answer: 1 },
    { q: "9. لفظ 'قدیم' کا درست مترادف (ہم معنی) لفظ کون سا ہے؟", options: ["الف) نیا", "ب) پرانا", "ج) جدید", "د) تازہ"], answer: 1 },
    { q: "10. 'علی نے خط لکھا' اس جملے میں لفظ 'نے' کیا کہلاتا ہے؟", options: ["الف) علامتِ مفعول", "ب) علامتِ فاعل", "ج) فعل", "د) صفت"], answer: 1 },
    { q: "11. 'استاد نے شاگرد کو شاباش دی' اس جملے میں لفظ 'کو' کیا ہے؟", options: ["الف) علامتِ فاعل", "ب) علامتِ مفعول", "ج) حرفِ عطف", "د) اسمِ نکرہ"], answer: 1 },
    { q: "12. محاورہ 'باغ باغ ہونا' کا درست مطلب کیا ہے؟", options: ["الف) بہت اداس ہونا", "ب) بہت خوش ہونا", "ج) سیر کرنا", "د) غصہ ہونا"], answer: 1 },
    { q: "13. وہ زمانہ جو گزر چکا ہو، قواعد کی رو سے کیا کہلاتا ہے؟", options: ["الف) فعلِ حال", "ب) فعلِ ماضی", "ج) فعلِ مستقبل", "د) فعلِ امر"], answer: 1 },
    { q: "14. 'احمد کل لاہور جائے گا' یہ جملہ کس زمانے سے تعلق رکھتا ہے؟", options: ["الف) ماضی", "ب) حال", "ج) مستقبل", "د) جاری"], answer: 2 },
    { q: "15. کسی کی کہی ہوئی بات کو جوں کا توں لکھنے کے لیے کون سی علامت استعمال ہوتی ہے؟", options: ["الف) واوین (” “)", "ب) سکتہ (،)", "ج) رابطہ (:) ", "د) سوالیہ (؟)"], answer: 0 },
    { q: "16. لفظ 'ہمدرد' میں 'ہم' قواعد کی رو سے کیا ہے؟", options: ["الف) لاحقہ", "ب) سابقہ", "ج) فعل", "د) ضمیر"], answer: 1 },
    { q: "17. لفظ 'عقل مند' میں 'مند' قواعد کی رو سے کیا کہلاتا ہے؟", options: ["الف) سابقہ", "ب) لاحقہ", "ج) حرفِ جار", "د) صفت"], answer: 1 },
    { q: "18. لفظ 'منظر' کی درست جمع کیا ہوگی؟", options: ["الف) منظروں", "ب) مناظر", "ج) مناظرات", "د) منظرین"], answer: 1 },
    { q: "19. 'ٹھنڈا پانی' اس مرکب میں لفظ 'ٹھنڈا' کیا ہے؟", options: ["الف) موصوف", "ب) صفت", "ج) فعل", "د) فاعل"], answer: 1 },
    { q: "20. 'پہلا، دوسرا، تیسرا' کون سی گنتی کہلاتی ہے؟", options: ["الف) عددی گنتی", "ب) ترتیبی گنتی", "ج) لفظی گنتی", "د) رومن گنتی"], answer: 1 }
];

let currentQuestionIndex = 0;

function startTest() {
    currentQuestionIndex = 0;
    document.getElementById('score-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    const qData = grade4UrduData[currentQuestionIndex];
    document.getElementById('question-text').innerText = qData.q;
    
    const optBox = document.getElementById('options-box');
    optBox.innerHTML = '';
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optBox.appendChild(btn);
    });

    document.getElementById('progress-text').innerText = `سوال ${currentQuestionIndex + 1} از ${grade4UrduData.length}`;
    document.getElementById('feedback-box').innerHTML = '';
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(selectedIndex, btnElement) {
    const buttons = document.querySelectorAll('.opt-btn');
    buttons.forEach(b => b.disabled = true);
    
    const qData = grade4UrduData[currentQuestionIndex];
    const feedbackBox = document.getElementById('feedback-box');
    
    if (selectedIndex === qData.answer) {
        btnElement.style.background = '#2b9348';
        btnElement.style.color = '#fff';
        feedbackBox.innerHTML = '<span style="color: #2b9348;">✅ درست جواب! (Correct Answer)</span>';
    } else {
        btnElement.style.background = '#d90429';
        btnElement.style.color = '#fff';
        buttons[qData.answer].style.background = '#2b9348';
        buttons[qData.answer].style.color = '#fff';
        feedbackBox.innerHTML = '<span style="color: #d90429;">❌ غلط جواب! (Incorrect Answer)</span>';
    }
    
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < grade4UrduData.length) {
        loadQuestion();
    } else {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('score-screen').style.display = 'block';
    }
}

window.onload = function() {
    startTest();
};
</script>

</body>
</html>
